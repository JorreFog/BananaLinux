<html><head><meta charset="utf-8"><title>RG DS Plus</title>

</head><body>
<div id="title"><b>Banana</b>OS<small>LAYOUT THEMES</small></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = +(new URLSearchParams(location.search).get('w') || 1920), H = Math.round(W * 9 / 16);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080c);
scene.fog = new THREE.Fog(0x07080c, 380, 900);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;

const camera = new THREE.PerspectiveCamera(30, W / H, 5, 2000);

// ---- textures made here -------------------------------------------------------------------------------------------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
// fine grain for the plastic's bump (a metallic-flake finish)
function noise(ctx, w, h, amp) {
  const d = ctx.createImageData(w, h);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - 0.5) * amp; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  ctx.putImageData(d, 0, 0);
}
const grain = canvasTex(512, 512, (c, w, h) => noise(c, w, h, 90), false);
grain.wrapS = grain.wrapT = THREE.RepeatWrapping; grain.repeat.set(6, 6);
const roughGrain = canvasTex(256, 256, (c, w, h) => noise(c, w, h, 40), false);
roughGrain.wrapS = roughGrain.wrapT = THREE.RepeatWrapping; roughGrain.repeat.set(5, 5);

// ---- materials ------------------------------------------------------------------------------------------------------
const SHELL = new URLSearchParams(location.search).get('color') || '#17171a';
// Matte Black: a fine-textured satin plastic
const shell = new THREE.MeshPhysicalMaterial({ color: SHELL, metalness: 0.0, roughness: 0.48, roughnessMap: roughGrain,
  bumpMap: grain, bumpScale: 0.012, clearcoat: 0.25, clearcoatRoughness: 0.45, sheen: 0.12, sheenRoughness: 0.7, sheenColor: new THREE.Color('#5a5f6e') });
const seam = new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.9 });
const bezelMat = new THREE.MeshPhysicalMaterial({ color: 0x0b0b0d, roughness: 0.32, clearcoat: 0.6, clearcoatRoughness: 0.2 });
const inkMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.7 });
const shellDark = shell.clone(); shellDark.color = new THREE.Color(SHELL).multiplyScalar(0.62); shellDark.clearcoat = 0.4;
const glass = new THREE.MeshPhysicalMaterial({ color: 0x050608, metalness: 0, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.03, reflectivity: 0.6, envMapIntensity: 0.35 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.82, metalness: 0 });
const buttonMat = new THREE.MeshPhysicalMaterial({ color: 0x1d1e22, roughness: 0.32, metalness: 0.05, clearcoat: 0.6, clearcoatRoughness: 0.25 });
const holeMat = new THREE.MeshStandardMaterial({ color: 0x020203, roughness: 1 });
const metal = new THREE.MeshStandardMaterial({ color: 0xb9bcc4, metalness: 1, roughness: 0.42 });

// ---- shapes ---------------------------------------------------------------------------------------------------------
function rrShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// a slab lying flat: w (x) by d (z), thick (y), its bottom at y = 0, bevelled edges
function slab(w, d, thick, r, bevel, mat, segs = 6) {
  const g = new THREE.ExtrudeGeometry(rrShape(w - 2 * bevel, d - 2 * bevel, Math.max(0.1, r - bevel)),
    { depth: thick - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: segs, curveSegments: 24 });
  g.rotateX(-Math.PI / 2); g.translate(0, bevel, 0);
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true;
  return m;
}
function add(parent, mesh, x, y, z) { mesh.position.set(x, y, z); parent.add(mesh); return mesh; }

// ---- the console (mm; x across, z towards the player, y up), measured from Anbernic's drawing: 167 wide, 96 deep,
// 24 thick closed, 181 tall opened flat ------------------------------------------------------------------------------
const device = new THREE.Group();
scene.add(device);
const BW = 167, BD = 96, BT = 13, LT = 11;	// body width, depth, base and lid thickness (24 mm closed)
const R = 7.5;								// the corners' radius (a DSi XL's squarer outline)
const SCR_W = 87.4, SCR_H = 65.5;			// a 4.3" 4:3 panel's picture
const HZ = -BD / 2 + 5.5, HY = BT + 1.2;	// the hinge's axis (base coordinates)

// ---- the base -----------------------------------------------------------------------------------------------------
const base = new THREE.Group(); device.add(base);
add(base, slab(BW, BD, BT, R, 1.8, shell), 0, 0, 0);
// the seam between the face plate and the bottom shell
add(base, slab(BW + 0.3, BD + 0.3, 0.5, R, 0.2, seam, 2), 0, 5.2, 0);
// the hinge's two knuckles at the back corners
for (const sx of [-1, 1]) {
  const k = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, 13, 48), shell); k.rotation.z = Math.PI / 2; k.castShadow = k.receiveShadow = true;
  add(base, k, sx * (BW / 2 - 7.5), HY, HZ);
  const end = new THREE.Mesh(new THREE.CircleGeometry(4.2, 32), seam); end.rotation.y = sx * Math.PI / 2; add(base, end, sx * (BW / 2 - 0.95), HY, HZ);
}
const FACE = BT + 0.01;
// the bottom screen: a raised dark panel round it, the glass, the picture
add(base, slab(102, 78, 0.9, 4, 0.35, bezelMat, 3), 0, FACE - 0.2, 3);
add(base, slab(92, 70, 0.4, 1.5, 0.1, glass, 2), 0, FACE + 0.62, 3);
const screenB = new THREE.Mesh(new THREE.PlaneGeometry(SCR_W, SCR_H), null);
screenB.rotation.x = -Math.PI / 2; add(base, screenB, 0, FACE + 1.03, 3);

// the d-pad, high on the left
const DPX = -67, DPZ = -21;
{
  const a = 7.6, L = 21;
  const s = new THREE.Shape();
  const pts = [[-a/2,-L/2],[a/2,-L/2],[a/2,-a/2],[L/2,-a/2],[L/2,a/2],[a/2,a/2],[a/2,L/2],[-a/2,L/2],[-a/2,a/2],[-L/2,a/2],[-L/2,-a/2],[-a/2,-a/2]];
  s.moveTo(...pts[0]); for (const p of pts.slice(1)) s.lineTo(...p); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 1.3, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.6, bevelSegments: 4 });
  g.rotateX(-Math.PI / 2);
  const well = new THREE.Mesh(new THREE.ExtrudeGeometry((() => { const w = rrShape(L + 3, a + 3, 2); return w; })(), { depth: 0.2, bevelEnabled: false }), holeMat);
  well.geometry.rotateX(-Math.PI / 2);
  add(base, well, DPX, FACE - 0.15, DPZ); const w2 = well.clone(); w2.rotation.y = Math.PI / 2; add(base, w2, DPX, FACE - 0.15, DPZ);
  const dpad = new THREE.Mesh(g, buttonMat); dpad.castShadow = true; add(base, dpad, DPX, FACE + 0.1, DPZ);
  const tri = new THREE.Shape(); tri.moveTo(-1.4, 0); tri.lineTo(1.4, 0); tri.lineTo(0, 1.9); tri.closePath();
  const tg = new THREE.ShapeGeometry(tri); tg.rotateX(-Math.PI / 2);
  for (let k = 0; k < 4; k++) {
    const m = new THREE.Mesh(tg, inkMat); m.rotation.y = k * Math.PI / 2;
    const ang = k * Math.PI / 2; add(base, m, DPX - Math.sin(ang) * 7.2, FACE + 2.12, DPZ - Math.cos(ang) * 7.2);
  }
}
// the stick under it: a big flat cap with a ridged rim, in a dark well
{
  const g = new THREE.Group(); add(base, g, -67, FACE, 9);
  const hole = new THREE.Mesh(new THREE.CylinderGeometry(12.2, 12.2, 0.3, 64), holeMat); hole.position.y = -0.1; g.add(hole);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(12.4, 0.5, 12, 64), seam); lip.rotation.x = Math.PI / 2; g.add(lip);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.4, 3, 24), rubber); stem.position.y = 1.2; g.add(stem);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(10.2, 9.8, 2.2, 64), rubber); cap.position.y = 3.4; cap.castShadow = true; g.add(cap);
  // the knurled edge
  const ridges = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 2.0, 0.8), rubber, 72);
  const m = new THREE.Matrix4();
  for (let i = 0; i < 72; i++) { const a = i / 72 * Math.PI * 2; m.makeRotationY(-a).setPosition(Math.cos(a) * 10.1, 3.4, Math.sin(a) * 10.1); ridges.setMatrixAt(i, m); }
  g.add(ridges);
  const top = new THREE.Mesh(new THREE.CircleGeometry(9.4, 64), new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.92,
    bumpMap: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#808080'; c.fillRect(0, 0, w, h); c.strokeStyle = '#a8a8a8'; c.lineWidth = 3;
      for (let r = 30; r < 128; r += 14) { c.beginPath(); c.arc(128, 128, r, 0, 7); c.stroke(); } }, false), bumpScale: 0.4 }));
  top.rotation.x = -Math.PI / 2; top.position.y = 4.52; g.add(top);
}
// two small round buttons under the stick, two under the face buttons
function roundBtn(r) { const b = new THREE.Mesh(new THREE.CylinderGeometry(r, r + 0.15, 1.6, 40), buttonMat); b.castShadow = true; return b; }
function ringAt(x, z, r) { const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.3, 10, 40), holeMat); ring.rotation.x = Math.PI / 2; add(base, ring, x, FACE + 0.02, z); }
const smallBtns = {};
for (const [k, x, z] of [['l3', -74, 31], ['r3', -61, 31], ['start', 59, 20], ['select', 59, 30]]) { ringAt(x, z, 3.2); smallBtns[k] = add(base, roundBtn(2.8), x, FACE + 0.55, z); }
// ABXY: small, close together, top right
const abxy = {};
for (const [k, dx, dz] of [['X', 0, -7.2], ['A', 7.2, 0], ['B', 0, 7.2], ['Y', -7.2, 0]]) {
  const top = canvasTex(128, 128, (c, w, h) => { c.fillStyle = '#18181c'; c.fillRect(0, 0, w, h); c.fillStyle = '#c9cbd2';
    c.font = 'bold 66px Inter, Arial, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(k, 64, 68); });
  const mats = [buttonMat, new THREE.MeshPhysicalMaterial({ map: top, roughness: 0.35, clearcoat: 0.5, clearcoatRoughness: 0.3 }), buttonMat];
  const b = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.45, 2.2, 48), mats); b.castShadow = true;
  ringAt(66 + dx, -11 + dz, 3.75);
  abxy[k] = add(base, b, 66 + dx, FACE + 0.9, -11 + dz);
}
// the lights near the right edge, and the one at the front left
const leds = [];
for (const z of [-24, -19]) { const l = new THREE.Mesh(new THREE.CircleGeometry(0.7, 20), new THREE.MeshBasicMaterial({ color: 0x0c2a12, toneMapped: false }));
  l.rotation.x = -Math.PI / 2; add(base, l, 77, FACE + 0.02, z); leds.push(l); }
// printing on the face: the small buttons' names
const printTex = canvasTex(1670, 960, (c, w, h) => {
  c.clearRect(0, 0, w, h); c.fillStyle = 'rgba(200,203,212,0.7)'; c.textAlign = 'left';
  const at = (x, z) => [w / 2 + x * 10, h / 2 + z * 10];
  c.font = '600 20px Inter, Arial'; c.fillText('START', ...at(63.5, 21)); c.fillText('SELECT', ...at(63.5, 31));
  c.textAlign = 'center'; c.fillText('L3', ...at(-74, 37.2)); c.fillText('R3', ...at(-61, 37.2));
});
const print = new THREE.Mesh(new THREE.PlaneGeometry(BW, BD), new THREE.MeshStandardMaterial({ map: printTex, transparent: true, roughness: 0.6, depthWrite: false }));
print.rotation.x = -Math.PI / 2; add(base, print, 0, FACE + 0.03, 0);
// the shoulders: L1 over L2 at each back corner, under the hinge's knuckles
for (const sx of [-1, 1]) {
  add(base, slab(30, 10, 3.6, 4, 1.0, buttonMat, 3), sx * (BW / 2 - 18), 1.0, -BD / 2 + 3.4);
  add(base, slab(28, 9, 3.4, 4, 1.0, buttonMat, 3), sx * (BW / 2 - 19), 5.2, -BD / 2 + 2.6);
}
// the back edge, left to right: microSD, USB-C, USB-C, the 3.5 mm jack, microSD
function slot(w, h, depth, mat = holeMat) { return new THREE.Mesh(new RoundedBoxGeometry(w, h, depth, 2, Math.min(w, h) / 2 - 0.01), mat); }
const backZ = -BD / 2 - 0.02;
add(base, slot(12, 1.6, 1), -41, 6.5, backZ); add(base, slot(12, 1.6, 1), 39, 6.5, backZ);
for (const x of [-20, 8]) { add(base, slot(9, 3.2, 1), x, 6.5, backZ); add(base, slot(6.4, 0.8, 1.1, metal), x, 6.5, backZ - 0.05); }
{ const j = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 1, 32), holeMat); j.rotation.x = Math.PI / 2; add(base, j, 25, 6.5, backZ + 0.3); }
// the front edge: the microphone and a light at the left
{ const m = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1, 16), holeMat); m.rotation.x = Math.PI / 2; add(base, m, -66, 6.5, BD / 2 + 0.1);
  const l = new THREE.Mesh(new THREE.CircleGeometry(0.8, 16), new THREE.MeshBasicMaterial({ color: 0x0c2a12, toneMapped: false })); add(base, l, -62, 6.5, BD / 2 + 0.06); leds.push(l); }
// the volume rocker on the left side, the stylus's end in its silo at the right back
{ const v = new THREE.Mesh(new RoundedBoxGeometry(1.6, 3.2, 16, 3, 0.75), buttonMat); add(base, v, -BW / 2 - 0.3, 6.5, 6); }
{ const cap = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 1.6, 32), buttonMat); cap.rotation.x = Math.PI / 2; add(base, cap, BW / 2 - 10, 3.5, -BD / 2 - 0.4); }
// the underside: four screws
for (const [x, z] of [[-74, -36], [74, -36], [-74, 40], [74, 40]]) {
  const s = new THREE.Mesh(new THREE.CircleGeometry(1.4, 20), metal); s.rotation.x = Math.PI / 2; add(base, s, x, -0.05, z);
}

// ---- the lid --------------------------------------------------------------------------------------------------------
// it turns about the hinge's axis; closed, it lies on the base with its screen facing down
const lidPivot = new THREE.Group(); add(device, lidPivot, 0, HY, HZ);
const lid = new THREE.Group(); lidPivot.add(lid);
const LD = 96.5, LZ0 = -5.5;	// the lid from just behind the axis to its front edge (181 mm opened flat)
add(lid, slab(BW, LD, LT, R, 1.8, shell), 0, -HY + BT + 0.4, LZ0 + LD / 2);
// the barrel across the middle, between the base's knuckles
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, BW - 30.5, 48), shell); barrel.rotation.z = Math.PI / 2; barrel.castShadow = true;
add(lid, barrel, 0, 0, 0);
const notch = new THREE.Mesh(new THREE.BoxGeometry(6, 0.6, 2), holeMat); add(lid, notch, 0, 6.1, -0.5);
// the inner face (it faces -y): the dark panel, the screen, the speakers, the feet
const INNER = -HY + BT + 0.39;
const LCZ = LZ0 + LD / 2 + 2;
const panel = slab(152, 80, 0.5, 4, 0.2, bezelMat, 2); panel.rotation.x = Math.PI; add(lid, panel, 0, INNER + 0.25, LCZ);
const tglass = slab(92, 70, 0.4, 1.5, 0.1, glass, 2); tglass.rotation.x = Math.PI; add(lid, tglass, 0, INNER - 0.24, LCZ);
const screenT = new THREE.Mesh(new THREE.PlaneGeometry(SCR_W, SCR_H), null);
screenT.rotation.x = Math.PI / 2; add(lid, screenT, 0, INNER - 0.66, LCZ);
{
  // the speakers: a ring of seven holes round one, each side of the screen
  const holes = new THREE.InstancedMesh(new THREE.CircleGeometry(0.5, 12), holeMat, 16);
  let k = 0; const m = new THREE.Matrix4(), rot = new THREE.Matrix4().makeRotationX(Math.PI / 2);
  for (const sx of [-1, 1]) for (let i = 0; i < 8; i++) {
    const a = i / 7 * Math.PI * 2, r = i === 7 ? 0 : 2.4;
    m.makeTranslation(sx * 59 + Math.cos(a) * r, INNER - 0.3, LCZ - 8 + Math.sin(a) * r).multiply(rot); holes.setMatrixAt(k++, m);
  }
  lid.add(holes);
  // the rubber feet that meet the base when it closes
  for (const [x, z] of [[-76, LZ0 + 6], [76, LZ0 + 6], [-76, LZ0 + LD - 6], [76, LZ0 + LD - 6]]) {
    const f = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.5, 20), rubber); add(lid, f, x, INNER - 0.2, z);
  }
}
// the lid's print: BananaOS under the top screen
const lidPrint = canvasTex(1520, 800, (c, w, h) => { c.clearRect(0, 0, w, h); c.textAlign = 'center';
  c.font = '600 26px Inter, Arial'; c.fillStyle = 'rgba(255,216,74,0.9)'; c.fillText('Banana', w / 2 - 28, h / 2 - 352);
  c.fillStyle = 'rgba(220,224,235,0.8)'; c.fillText('OS', w / 2 + 52, h / 2 - 352); });
const lp = new THREE.Mesh(new THREE.PlaneGeometry(152, 80), new THREE.MeshBasicMaterial({ map: lidPrint, transparent: true, depthWrite: false }));
lp.rotation.x = Math.PI / 2; add(lid, lp, 0, INNER - 0.68, LCZ);

// ---- the screens' pictures: a canvas each, the theme's frame with the switch's effects on it ---------------------
function screenCanvas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 768;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return { c, ctx: c.getContext('2d'), t };
}
const scr = [screenCanvas(), screenCanvas()];
function screenMat(t) {
  return new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.82, envMapIntensity: 0.3, roughness: 0.08, metalness: 0 });
}
screenT.material = screenMat(scr[0].t);
screenB.material = screenMat(scr[1].t);
// ---- the set: a dark floor, a key light with soft shadows, coloured rims ---------------------------------------------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: 0x0c0d12, roughness: 0.55, metalness: 0.15 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.4; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xfff1dc, 2.6);
key.position.set(-120, 260, 160); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 6; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.3;
Object.assign(key.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, near: 50, far: 700 });
scene.add(key);
const rimA = new THREE.SpotLight(0x8a5cff, 20000, 900, 0.5, 0.7, 2); rimA.position.set(300, 45, -320); scene.add(rimA);
const rimB = new THREE.SpotLight(0xffc640, 30000, 900, 0.5, 0.7, 2); rimB.position.set(-280, 90, -200); scene.add(rimB);
const fill = new THREE.HemisphereLight(0x9fb4ff, 0x0b0b10, 0.35); scene.add(fill);
// the screens' light on the set
const screenGlow = new THREE.PointLight(0xaec8ff, 0, 260, 2); scene.add(screenGlow);

// ---- post-processing: bloom, depth of field, then the film: aberration, grain, vignette, grade, bars -------------
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.32, 0.55, 0.9);
composer.addPass(bloom);
const bokeh = new BokehPass(scene, camera, { focus: 300, aperture: 0.00006, maxblur: 0.008 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());
const film = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, ca: { value: 0.0016 }, grainAmt: { value: 0.03 }, vig: { value: 0.42 },
    bars: { value: 0.0 }, fade: { value: 1 }, flash: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time, ca, grainAmt, vig, bars, fade, flash; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + time * 0.71) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5; float r2 = dot(d, d);
      vec2 off = d * ca * (1.0 + r2 * 4.0);
      vec3 c = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      // the grade: cool shadows, warm highlights, a little contrast
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(c, c * vec3(0.92, 1.0, 1.1), smoothstep(0.5, 0.0, l) * 0.35);
      c = mix(c, c * vec3(1.06, 1.0, 0.92), smoothstep(0.45, 1.0, l) * 0.3);
      c = (c - 0.5) * 1.06 + 0.5;
      c *= 1.0 - vig * smoothstep(0.1, 0.75, r2 * 2.2);
      c += (h(vUv * vec2(1920.0, 1080.0)) - 0.5) * grainAmt;
      c += flash;
      c *= fade;
      if (vUv.y < bars || vUv.y > 1.0 - bars) c = vec3(0.0);
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`
});
composer.addPass(film);

// ---- the timeline ---------------------------------------------------------------------------------------------------
const THEMES = ['canvas', 'hillside', 'turntable', 'pocket'];
const SEG = [[3.4, 10.0], [10.0, 16.4], [16.4, 22.8], [22.8, 29.6]];	// each theme on the screens (s)
const DURATION = 34;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp01 = t => Math.min(1, Math.max(0, t));
const lerp = (a, b, t) => a + (b - a) * t;
const lerpV = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
// the shots: from (s), camera position, where it looks, focus distance, aperture
const SHOTS = [
  { t: 0.0,  pos: [-150, 70, 260], at: [0, 10, 0], ap: 0.00005 },
  { t: 3.2,  pos: [-60, 150, 230], at: [0, 30, -10], ap: 0.00005 },
  { t: 6.5,  pos: [70, 120, 220], at: [0, 35, -15], ap: 0.00004 },
  { t: 10.0, pos: [95, 70, 120], at: [5, 14, 8], ap: 0.0001 },
  { t: 13.4, pos: [-80, 80, 125], at: [-5, 14, 6], ap: 0.0001 },
  { t: 16.4, pos: [-130, 90, 170], at: [0, 50, -40], ap: 0.00008 },
  { t: 19.8, pos: [30, 100, 200], at: [0, 50, -40], ap: 0.00008 },
  { t: 22.8, pos: [0, 230, 120], at: [0, 20, -5], ap: 0.00005 },
  { t: 26.4, pos: [60, 175, 110], at: [0, 25, -5], ap: 0.00006 },
  { t: 29.6, pos: [150, 95, 230], at: [0, 30, -15], ap: 0.00004 },
  { t: 34.0, pos: [210, 130, 330], at: [0, 30, -15], ap: 0.00003 },
];
// a shot moves smoothly within itself and cuts with a quick ease into the next one (a camera move, not a jump)
function cameraAt(t) {
  let i = 0; while (i < SHOTS.length - 2 && t >= SHOTS[i + 1].t) i++;
  const a = SHOTS[i], b = SHOTS[i + 1];
  const k = ease(clamp01((t - a.t) / (b.t - a.t)));
  const pos = lerpV(a.pos, b.pos, k), at = lerpV(a.at, b.at, k);
  // a little hand-held drift
  pos[0] += Math.sin(t * 0.7) * 1.5; pos[1] += Math.sin(t * 0.53 + 1) * 1.2;
  return { pos, at, ap: lerp(a.ap, b.ap, k) };
}

const imgCache = new Map();
function loadImg(src) {
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  imgCache.set(src, p);
  if (imgCache.size > 64) imgCache.delete(imgCache.keys().next().value);
  return p;
}
async function frameOf(theme, t, side) {
  const n = Math.min(221, Math.max(0, Math.floor(t * 30)));
  return loadImg(`screens/${theme}/f${String(n).padStart(4, '0')}-${side}.jpg`);
}

// draws a screen: the theme in its segment, the switch between two (slices shifted, a white flash, scanlines)
async function drawScreen(i, t, on) {
  const { ctx, t: tex } = scr[i];
  const side = i === 0 ? 'top' : 'bot';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1024, 768);
  if (on > 0) {
    let s = SEG.findIndex(([a, b]) => t >= a && t < b); if (s < 0) s = t < SEG[0][0] ? 0 : SEG.length - 1;
    const local = t - SEG[s][0];
    const img = await frameOf(THEMES[s], local, side);
    const sw = clamp01(1 - Math.abs(t - SEG[s][0]) / 0.28) * (s > 0 ? 1 : 0);	// near a switch
    ctx.globalAlpha = on;
    if (img) {
      if (sw > 0) {
        const prev = await frameOf(THEMES[s - 1], SEG[s - 1][1] - SEG[s - 1][0] - 0.01, side);
        const src = t < SEG[s][0] ? prev : img;
        for (let y = 0; y < 768; y += 32) {
          const dx = (Math.sin(y * 12.9 + t * 80) * 0.5 + (Math.random() - 0.5)) * 140 * sw;
          ctx.drawImage(src || img, 0, y, 1024, 32, dx, y, 1024, 32);
        }
        ctx.fillStyle = `rgba(255,255,255,${0.6 * sw})`; ctx.fillRect(0, 0, 1024, 768);
        ctx.fillStyle = `rgba(0,0,0,${0.25 * sw})`; for (let y = 0; y < 768; y += 4) ctx.fillRect(0, y, 1024, 2);
      } else ctx.drawImage(img, 0, 0);
    }
    // the backlight coming on
    if (on < 1) { ctx.globalAlpha = (1 - on) * 0.8; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 1024, 768); }
    ctx.globalAlpha = 1;
  }
  tex.needsUpdate = true;
}

window.renderAt = async function (t) {
  // the lid opens, then the screens light up
  const open = ease(clamp01((t - 0.8) / 2.4));
  lidPivot.rotation.x = -open * THREE.MathUtils.degToRad(152);
  const on = clamp01((t - 3.0) / 0.5);
  await drawScreen(0, t, on); await drawScreen(1, t, on);
  screenGlow.intensity = on * 260;
  const top = new THREE.Vector3(0, 40, -30); screenGlow.position.copy(top).add(new THREE.Vector3(0, 30, 40));
  for (const l of leds) l.material.color.set(on > 0 ? 0x55ff7a : 0x0c2a12);
  // the buttons go down when the themes' scripts press them (a light touch of life)
    // the device turns a little on the floor in the last shot
  device.rotation.y = THREE.MathUtils.degToRad(-8 + Math.max(0, t - 29.6) * 5);
  const c = cameraAt(t);
  camera.position.set(...c.pos); camera.lookAt(...c.at);
  const focusTarget = new THREE.Vector3(...c.at);
  bokeh.uniforms.focus.value = camera.position.distanceTo(focusTarget);
  bokeh.uniforms.aperture.value = c.ap;
  film.uniforms.time.value = t;
  film.uniforms.fade.value = clamp01(t / 1.0) * clamp01((DURATION - t) / 0.8);
  film.uniforms.bars.value = 0.06;
  film.uniforms.flash.value = 0;
  for (const [a] of SEG.slice(1)) film.uniforms.flash.value += 0.05 * clamp01(1 - Math.abs(t - a) / 0.15);
  document.getElementById('title').style.opacity = clamp01((t - 30.4) / 1.0);
  composer.render();
  return true;
};
// a still for checking the model: the lid at deg, the screens on, the camera at pos looking at at
window.pose = async function (deg, pos, at, fov = 30, t = 6) {
  const fog = scene.fog; scene.fog = null;
  lidPivot.rotation.x = -THREE.MathUtils.degToRad(deg);
  await drawScreen(0, t, 1); await drawScreen(1, t, 1);
  for (const l of leds) l.material.color.set(0x55ff7a);
  device.rotation.y = 0;
  camera.fov = fov; camera.updateProjectionMatrix();
  camera.position.set(...pos); camera.lookAt(...at);
  film.uniforms.fade.value = 1; film.uniforms.bars.value = 0; bokeh.uniforms.aperture.value = 0;
  composer.render(); scene.fog = fog;
};
window.DURATION = DURATION;
window.ready = true;
</script></body></html>
