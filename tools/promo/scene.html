</head><body>
<div id="title"><b>Banana</b>OS<small>LAYOUT THEMES</small></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = +(new URLSearchParams(location.search).get('w') || 1920), H = Math.round(W * 9 / 16);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080c);
scene.fog = new THREE.Fog(0x07080c, 380, 900);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(30, W / H, 5, 2000);

// ---- textures made here -------------------------------------------------------------------------------------------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
// fine grain for the plastic's bump (a metallic-flake finish)
function noise(ctx, w, h, amp) {
  const d = ctx.createImageData(w, h);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - 0.5) * amp; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  ctx.putImageData(d, 0, 0);
}
const grain = canvasTex(512, 512, (c, w, h) => noise(c, w, h, 90), false);
grain.wrapS = grain.wrapT = THREE.RepeatWrapping; grain.repeat.set(6, 6);
const roughGrain = canvasTex(256, 256, (c, w, h) => noise(c, w, h, 40), false);
roughGrain.wrapS = roughGrain.wrapT = THREE.RepeatWrapping; roughGrain.repeat.set(5, 5);

// ---- materials ------------------------------------------------------------------------------------------------------
const SHELL = new URLSearchParams(location.search).get('color') || '#27489a';
const shell = new THREE.MeshPhysicalMaterial({ color: SHELL, metalness: 0.55, roughness: 0.42, roughnessMap: roughGrain,
  bumpMap: grain, bumpScale: 0.025, clearcoat: 0.7, clearcoatRoughness: 0.16, sheen: 0.2, sheenColor: new THREE.Color('#8fb0ff') });
const shellDark = shell.clone(); shellDark.color = new THREE.Color(SHELL).multiplyScalar(0.62); shellDark.clearcoat = 0.4;
const glass = new THREE.MeshPhysicalMaterial({ color: 0x050608, metalness: 0, roughness: 0.06, clearcoat: 1, clearcoatRoughness: 0.03, reflectivity: 0.6, envMapIntensity: 0.35 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.82, metalness: 0 });
const buttonMat = new THREE.MeshPhysicalMaterial({ color: 0x24262c, roughness: 0.32, metalness: 0.05, clearcoat: 0.6, clearcoatRoughness: 0.25 });
const holeMat = new THREE.MeshStandardMaterial({ color: 0x020203, roughness: 1 });
const metal = new THREE.MeshStandardMaterial({ color: 0xb9bcc4, metalness: 1, roughness: 0.42 });

// ---- shapes ---------------------------------------------------------------------------------------------------------
function rrShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// a slab lying flat: w (x) by d (z), thick (y), its bottom at y = 0, bevelled edges
function slab(w, d, thick, r, bevel, mat, segs = 6) {
  const g = new THREE.ExtrudeGeometry(rrShape(w - 2 * bevel, d - 2 * bevel, Math.max(0.1, r - bevel)),
    { depth: thick - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: segs, curveSegments: 24 });
  g.rotateX(-Math.PI / 2); g.translate(0, bevel, 0);
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true;
  return m;
}
function add(parent, mesh, x, y, z) { mesh.position.set(x, y, z); parent.add(mesh); return mesh; }

// ---- the console (mm; x across, z towards the player, y up) ---------------------------------------------------------
const device = new THREE.Group();
scene.add(device);
const BW = 167, BD = 96, BT = 13, LT = 11;	// body width, depth, base and lid thickness (24 mm closed)
const SCR_W = 87.4, SCR_H = 65.5;			// a 4.3" 4:3 panel's picture

// ---- the base -----------------------------------------------------------------------------------------------------
const base = new THREE.Group(); device.add(base);
add(base, slab(BW, BD, BT, 12, 2.2, shell), 0, 0, 0);
// the parting line round the edge and the darker underside
add(base, slab(BW - 0.6, BD - 0.6, 4, 11.7, 1.4, shellDark), 0, -0.4, 0);
// the hinge: a barrel along the back, raised above the face
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(6.4, 6.4, 118, 48), shellDark);
barrel.rotation.z = Math.PI / 2; barrel.castShadow = barrel.receiveShadow = true;
add(base, barrel, 0, BT + 0.8, -BD / 2 + 7);
for (const sx of [-1, 1]) {	// its metal ends
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 1.2, 32), metal);
  cap.rotation.z = Math.PI / 2; add(base, cap, sx * 59.4, BT + 0.8, -BD / 2 + 7);
}
// the bottom screen in its glass, a little recessed
const FACE = BT + 0.01;
const bezelB = add(base, slab(104, 79, 0.8, 4.5, 0.3, glass, 3), 0, FACE - 0.2, 6);
const screenB = new THREE.Mesh(new THREE.PlaneGeometry(SCR_W, SCR_H), null);
screenB.rotation.x = -Math.PI / 2; add(base, screenB, 0, FACE + 0.62, 6);

// the d-pad: a cross with rounded arms, in a shallow well, top left
const dpadWell = new THREE.Mesh(new THREE.CylinderGeometry(14, 14.6, 0.6, 48), shellDark);
add(base, dpadWell, -64, FACE - 0.25, -12);
{
  const a = 8.2, L = 22, r = 1.6;
  const s = new THREE.Shape();
  const pts = [[-a/2,-L/2],[a/2,-L/2],[a/2,-a/2],[L/2,-a/2],[L/2,a/2],[a/2,a/2],[a/2,L/2],[-a/2,L/2],[-a/2,a/2],[-L/2,a/2],[-L/2,-a/2],[-a/2,-a/2]];
  s.moveTo(...pts[0]); for (const p of pts.slice(1)) s.lineTo(...p); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 1.6, bevelEnabled: true, bevelThickness: 0.7, bevelSize: 0.7, bevelSegments: 4 });
  g.rotateX(-Math.PI / 2);
  const dpad = new THREE.Mesh(g, buttonMat); dpad.castShadow = true; add(base, dpad, -64, FACE + 0.1, -12);
  // the arrows pressed into its arms and the dimple in the middle
  const tri = new THREE.Shape(); tri.moveTo(-1.6, 0); tri.lineTo(1.6, 0); tri.lineTo(0, 2.2); tri.closePath();
  const tg = new THREE.ShapeGeometry(tri); tg.rotateX(-Math.PI / 2);
  for (let k = 0; k < 4; k++) {
    const m = new THREE.Mesh(tg, holeMat); m.rotation.y = k * Math.PI / 2;
    const ang = k * Math.PI / 2; add(base, m, -64 - Math.sin(ang) * 7.4, FACE + 2.52, -12 - Math.cos(ang) * 7.4);
  }
  const dim = new THREE.Mesh(new THREE.CircleGeometry(2.2, 32), new THREE.MeshStandardMaterial({ color: 0x1b1c21, roughness: 0.6 }));
  dim.rotation.x = -Math.PI / 2; add(base, dim, -64, FACE + 2.51, -12);
}
// the stick: a ring well, the stem, a concave rubber cap with a grip ring
{
  const g = new THREE.Group(); add(base, g, -64, FACE, 22);
  const well = new THREE.Mesh(new THREE.TorusGeometry(11.6, 1.3, 16, 64), shellDark); well.rotation.x = Math.PI / 2; well.position.y = 0.2; g.add(well);
  const hole = new THREE.Mesh(new THREE.CircleGeometry(11, 64), holeMat); hole.rotation.x = -Math.PI / 2; hole.position.y = 0.05; g.add(hole);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(3, 3.4, 3, 24), rubber); stem.position.y = 1.2; g.add(stem);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(8.6, 8.2, 2.4, 64), rubber); cap.position.y = 3.6; cap.castShadow = true; g.add(cap);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(7.6, 0.9, 16, 64), rubber); rim.rotation.x = Math.PI / 2; rim.position.y = 4.85; g.add(rim);
  const top = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.MeshStandardMaterial({ color: 0x1c1d22, roughness: 0.9,
    bumpMap: canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#808080'; c.fillRect(0, 0, w, h); c.strokeStyle = '#b0b0b0'; c.lineWidth = 5;
      for (let r = 20; r < 128; r += 18) { c.beginPath(); c.arc(128, 128, r, 0, 7); c.stroke(); } }, false), bumpScale: 0.5 }));
  top.rotation.x = -Math.PI / 2; top.position.y = 4.4; g.add(top);
  base.userData.stick = g; base.userData.stickCap = [stem, cap, rim, top];
}
// ABXY: a diamond of round buttons, two-colour with their letters, top right
const abxy = {};
for (const [k, dx, dz] of [['X', 0, -8.4], ['A', 8.4, 0], ['B', 0, 8.4], ['Y', -8.4, 0]]) {
  const top = canvasTex(128, 128, (c, w, h) => { c.fillStyle = '#26282e'; c.fillRect(0, 0, w, h); c.fillStyle = '#d9dbe2';
    c.font = 'bold 70px Inter, Arial, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(k, 64, 68); });
  const mats = [buttonMat, new THREE.MeshPhysicalMaterial({ map: top, roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.2 }), buttonMat];
  const b = new THREE.Mesh(new THREE.CylinderGeometry(4.3, 4.5, 2.6, 48), mats); b.castShadow = true;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(4.9, 0.45, 12, 48), shellDark); ring.rotation.x = Math.PI / 2;
  add(base, ring, 64 + dx, FACE + 0.05, -12 + dz);
  abxy[k] = add(base, b, 64 + dx, FACE + 1.1, -12 + dz);
}
// Start and Select below the face buttons, Home and Back below the stick's side, the power light
function pill(w, d, h, mat) { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(d, h) / 2 - 0.01), mat); m.castShadow = true; return m; }
const smallBtns = {};
smallBtns.select = add(base, pill(7.5, 3.2, 1.6, buttonMat), 57, FACE + 0.6, 21);
smallBtns.start = add(base, pill(7.5, 3.2, 1.6, buttonMat), 71, FACE + 0.6, 21);
for (const [k, x] of [['home', 58], ['back', 70]]) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.5, 1.6, 32), buttonMat); b.castShadow = true;
  smallBtns[k] = add(base, b, x, FACE + 0.6, 33);
}
const led = new THREE.Mesh(new THREE.CircleGeometry(0.9, 24), new THREE.MeshBasicMaterial({ color: 0x55ff7a, toneMapped: false }));
led.rotation.x = -Math.PI / 2; add(base, led, -78, FACE + 0.02, 38);
// the microphone's hole below the screen
const mic = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), holeMat); mic.rotation.x = -Math.PI / 2; add(base, mic, 0, FACE + 0.02, 45);
// printing on the face
const printTex = canvasTex(1670, 960, (c, w, h) => {
  c.clearRect(0, 0, w, h); c.fillStyle = 'rgba(225,230,245,0.75)'; c.textAlign = 'center';
  const at = (x, z) => [w / 2 + x * 10, h / 2 + z * 10];
  c.font = '600 22px Inter, Arial'; for (const [t, x, z] of [['SELECT', 57, 25.2], ['START', 71, 25.2]]) c.fillText(t, ...at(x, z));
  c.font = '600 26px Inter, Arial'; c.fillText('⌂', ...at(58, 38.8)); c.fillText('↩', ...at(70, 38.8));
  c.font = '600 20px Inter, Arial'; c.fillText('CHG', ...at(-78, 42.2));
  c.font = '700 22px Inter, Arial'; c.fillText('L', ...at(-74, -33)); c.fillText('R', ...at(74, -33));
});
const print = new THREE.Mesh(new THREE.PlaneGeometry(BW, BD), new THREE.MeshStandardMaterial({ map: printTex, transparent: true, roughness: 0.5, depthWrite: false }));
print.rotation.x = -Math.PI / 2; add(base, print, 0, FACE + 0.03, 0);
// the shoulders: L1 over L2 at each back corner, wrapping round it
for (const sx of [-1, 1]) {
  const l2 = slab(36, 14, 4.2, 5, 1.2, buttonMat, 3); add(base, l2, sx * 64, 1.2, -BD / 2 + 4.5);
  const l1 = slab(34, 12, 4.4, 5, 1.4, buttonMat, 3); add(base, l1, sx * 65, 6.2, -BD / 2 + 3.6);
}
// the edges: USB-C at the back, the headphone jack at the front, both microSD slots on the left, volume on the right,
// the stylus's cap in its silo at the right back corner
function slot(w, h, depth, mat = holeMat) { const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, depth, 2, Math.min(w, h) / 2 - 0.01), mat); return m; }
add(base, slot(9, 3.2, 1), -14, 6.5, -BD / 2 - 0.05).add(add(new THREE.Group(), slot(6.6, 0.9, 1.2, metal), 0, 0, 0.1));
add(base, slot(9, 3.2, 1), 14, 6.5, -BD / 2 - 0.05);
{ const j = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 1.9, 1, 32), holeMat); j.rotation.x = Math.PI / 2; add(base, j, 34, 6.5, BD / 2 - 0.2);
  const jr = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.35, 12, 32), metal); add(base, jr, 34, 6.5, BD / 2 + 0.1); }
for (const z of [-6, 12]) { const s = slot(1.2, 1.6, 13); s.rotation.y = 0; add(base, s, -BW / 2 - 0.1, 6.5, z); }
{ const v = pill(1.6, 18, 3.2, buttonMat); add(base, v, BW / 2 + 0.2, 7, 4); }
{ const cap = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 2.4, 32), buttonMat); cap.rotation.x = Math.PI / 2; add(base, cap, BW / 2 - 9, 6.5, BD / 2 + 0.6); }

// ---- the lid --------------------------------------------------------------------------------------------------------
// a group turning about the hinge's axis; closed, the lid lies on the base with its screen facing down
const lidPivot = new THREE.Group(); add(device, lidPivot, 0, BT + 0.8, -BD / 2 + 7);
const lid = new THREE.Group(); lidPivot.add(lid);
const LD = 90;
// the lid's body from the hinge (z 0) to its front edge (z LD - 6), its inner face at y = 0.4 (closed: just above the base)
add(lid, slab(BW, LD, LT, 12, 2.2, shell), 0, -0.2 + 0.4, LD / 2 - 6.5);
// the knuckle round the barrel
const knuckle = new THREE.Mesh(new THREE.CylinderGeometry(7.4, 7.4, 34, 48), shell); knuckle.rotation.z = Math.PI / 2; knuckle.castShadow = true;
add(lid, knuckle, -76 + 17, 4.5, -1); add(lid, knuckle.clone(), 76 - 17, 4.5, -1);
// the inner face (it faces -y): the glass, the screen, the speakers, the light sensor
const INNER = 0.39;
const bezelT = slab(150, 80, 0.8, 5, 0.3, glass, 3); bezelT.rotation.x = Math.PI; add(lid, bezelT, 0, INNER + 0.2, LD / 2 - 3);
const screenT = new THREE.Mesh(new THREE.PlaneGeometry(SCR_W, SCR_H), null);
screenT.rotation.x = Math.PI / 2; add(lid, screenT, 0, INNER - 0.62, LD / 2 - 1.5);
{
  const holes = new THREE.InstancedMesh(new THREE.CircleGeometry(0.55, 12), holeMat, 2 * 7 * 6);
  let k = 0; const m = new THREE.Matrix4(), rot = new THREE.Matrix4().makeRotationX(Math.PI / 2);
  for (const sx of [-1, 1]) for (let i = 0; i < 7; i++) for (let j = 0; j < 6; j++) {
    m.makeTranslation(sx * 61 + (j - 2.5) * 2.4 + (i % 2) * 1.2, INNER - 0.63, LD / 2 - 1.5 + (i - 3) * 2.4).multiply(rot); holes.setMatrixAt(k++, m);
  }
  lid.add(holes);
}
// the lid's print: BananaOS under the top screen
const lidPrint = canvasTex(1500, 800, (c, w, h) => { c.clearRect(0, 0, w, h); c.textAlign = 'center';
  c.font = '600 30px Inter, Arial'; c.fillStyle = 'rgba(255,216,74,0.9)'; c.fillText('Banana', w / 2 - 34, h / 2 + 378);
  c.fillStyle = 'rgba(230,234,245,0.85)'; c.fillText('OS', w / 2 + 62, h / 2 + 378); });
const lp = new THREE.Mesh(new THREE.PlaneGeometry(150, 80), new THREE.MeshBasicMaterial({ map: lidPrint, transparent: true, depthWrite: false }));
lp.rotation.x = Math.PI / 2; add(lid, lp, 0, INNER - 0.64, LD / 2 - 3);
// the outside of the lid: a banana pressed into the shell
const emblem = canvasTex(512, 512, (c, w, h) => { c.clearRect(0, 0, w, h); c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 16; c.lineCap = 'round';
  c.beginPath(); c.arc(220, 170, 190, 0.55, 1.95); c.stroke(); c.beginPath(); c.arc(236, 140, 150, 0.6, 1.85); c.stroke(); }, false);
const emb = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), new THREE.MeshPhysicalMaterial({ color: new THREE.Color(SHELL).multiplyScalar(1.25),
  metalness: 0.8, roughness: 0.18, alphaMap: emblem, transparent: true, clearcoat: 1 }));
emb.rotation.x = -Math.PI / 2; add(lid, emb, 0, LT + 0.42, LD / 2 - 3);

// ---- the screens' pictures: a canvas each, the theme's frame with the switch's effects on it ---------------------
function screenCanvas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 768;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return { c, ctx: c.getContext('2d'), t };
}
const scr = [screenCanvas(), screenCanvas()];
function screenMat(t) {
  return new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.82, envMapIntensity: 0.3, roughness: 0.08, metalness: 0 });
}
screenT.material = screenMat(scr[0].t);
screenB.material = screenMat(scr[1].t);
// a glass layer over each screen for its reflections
for (const [m, parent] of [[screenT, lid], [screenB, base]]) {
  const g = new THREE.Mesh(m.geometry, new THREE.MeshPhysicalMaterial({ color: 0x000000, transparent: true, opacity: 0.12, roughness: 0.03, clearcoat: 1, depthWrite: false }));
  g.rotation.copy(m.rotation); g.scale.copy(m.scale); g.position.copy(m.position); g.position.y += parent === base ? 0.05 : -0.05; parent.add(g);
}

// ---- the set: a dark floor, a key light with soft shadows, coloured rims ---------------------------------------------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: 0x0c0d12, roughness: 0.38, metalness: 0.2,
  roughnessMap: roughGrain }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.4; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xfff1dc, 2.6);
key.position.set(-120, 260, 160); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 6; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.3;
Object.assign(key.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, near: 50, far: 700 });
scene.add(key);
const rimA = new THREE.SpotLight(0x8a5cff, 12000, 900, 0.5, 0.7, 2); rimA.position.set(260, 120, -260); scene.add(rimA);
const rimB = new THREE.SpotLight(0xffc640, 22000, 900, 0.5, 0.7, 2); rimB.position.set(-280, 90, -200); scene.add(rimB);
const fill = new THREE.HemisphereLight(0x9fb4ff, 0x0b0b10, 0.35); scene.add(fill);
// the screens' light on the set
const screenGlow = new THREE.PointLight(0xaec8ff, 0, 260, 2); scene.add(screenGlow);

// ---- post-processing: bloom, depth of field, then the film: aberration, grain, vignette, grade, bars -------------
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.32, 0.55, 0.9);
composer.addPass(bloom);
const bokeh = new BokehPass(scene, camera, { focus: 300, aperture: 0.00006, maxblur: 0.008 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());
const film = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, ca: { value: 0.0016 }, grainAmt: { value: 0.045 }, vig: { value: 0.42 },
    bars: { value: 0.0 }, fade: { value: 1 }, flash: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time, ca, grainAmt, vig, bars, fade, flash; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + time * 0.71) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5; float r2 = dot(d, d);
      vec2 off = d * ca * (1.0 + r2 * 4.0);
      vec3 c = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      // the grade: cool shadows, warm highlights, a little contrast
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(c, c * vec3(0.92, 1.0, 1.1), smoothstep(0.5, 0.0, l) * 0.35);
      c = mix(c, c * vec3(1.06, 1.0, 0.92), smoothstep(0.45, 1.0, l) * 0.3);
      c = (c - 0.5) * 1.06 + 0.5;
      c *= 1.0 - vig * smoothstep(0.1, 0.75, r2 * 2.2);
      c += (h(vUv * vec2(1920.0, 1080.0)) - 0.5) * grainAmt;
      c += flash;
      c *= fade;
      if (vUv.y < bars || vUv.y > 1.0 - bars) c = vec3(0.0);
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`
});
composer.addPass(film);

// ---- the timeline ---------------------------------------------------------------------------------------------------
const THEMES = ['canvas', 'hillside', 'turntable', 'pocket'];
const SEG = [[3.4, 10.0], [10.0, 16.4], [16.4, 22.8], [22.8, 29.6]];	// each theme on the screens (s)
const DURATION = 34;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp01 = t => Math.min(1, Math.max(0, t));
const lerp = (a, b, t) => a + (b - a) * t;
const lerpV = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
// the shots: from (s), camera position, where it looks, focus distance, aperture
const SHOTS = [
  { t: 0.0,  pos: [-150, 70, 260], at: [0, 10, 0], ap: 0.00005 },
  { t: 3.2,  pos: [-60, 150, 230], at: [0, 30, -10], ap: 0.00005 },
  { t: 6.5,  pos: [70, 120, 220], at: [0, 35, -15], ap: 0.00004 },
  { t: 10.0, pos: [95, 70, 120], at: [5, 14, 8], ap: 0.0001 },
  { t: 13.4, pos: [-80, 80, 125], at: [-5, 14, 6], ap: 0.0001 },
  { t: 16.4, pos: [-130, 90, 170], at: [0, 50, -40], ap: 0.00008 },
  { t: 19.8, pos: [30, 100, 200], at: [0, 50, -40], ap: 0.00008 },
  { t: 22.8, pos: [0, 230, 120], at: [0, 20, -5], ap: 0.00005 },
  { t: 26.4, pos: [60, 175, 110], at: [0, 25, -5], ap: 0.00006 },
  { t: 29.6, pos: [150, 95, 230], at: [0, 30, -15], ap: 0.00004 },
  { t: 34.0, pos: [210, 130, 330], at: [0, 30, -15], ap: 0.00003 },
];
// a shot moves smoothly within itself and cuts with a quick ease into the next one (a camera move, not a jump)
function cameraAt(t) {
  let i = 0; while (i < SHOTS.length - 2 && t >= SHOTS[i + 1].t) i++;
  const a = SHOTS[i], b = SHOTS[i + 1];
  const k = ease(clamp01((t - a.t) / (b.t - a.t)));
  const pos = lerpV(a.pos, b.pos, k), at = lerpV(a.at, b.at, k);
  // a little hand-held drift
  pos[0] += Math.sin(t * 0.7) * 1.5; pos[1] += Math.sin(t * 0.53 + 1) * 1.2;
  return { pos, at, ap: lerp(a.ap, b.ap, k) };
}

const imgCache = new Map();
function loadImg(src) {
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  imgCache.set(src, p);
  if (imgCache.size > 64) imgCache.delete(imgCache.keys().next().value);
  return p;
}
async function frameOf(theme, t, side) {
  const n = Math.min(221, Math.max(0, Math.floor(t * 30)));
  return loadImg(`screens/${theme}/f${String(n).padStart(4, '0')}-${side}.jpg`);
}

// draws a screen: the theme in its segment, the switch between two (slices shifted, a white flash, scanlines)
async function drawScreen(i, t, on) {
  const { ctx, t: tex } = scr[i];
  const side = i === 0 ? 'top' : 'bot';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1024, 768);
  if (on > 0) {
    let s = SEG.findIndex(([a, b]) => t >= a && t < b); if (s < 0) s = t < SEG[0][0] ? 0 : SEG.length - 1;
    const local = t - SEG[s][0];
    const img = await frameOf(THEMES[s], local, side);
    const sw = clamp01(1 - Math.abs(t - SEG[s][0]) / 0.28) * (s > 0 ? 1 : 0);	// near a switch
    ctx.globalAlpha = on;
    if (img) {
      if (sw > 0) {
        const prev = await frameOf(THEMES[s - 1], SEG[s - 1][1] - SEG[s - 1][0] - 0.01, side);
        const src = t < SEG[s][0] ? prev : img;
        for (let y = 0; y < 768; y += 32) {
          const dx = (Math.sin(y * 12.9 + t * 80) * 0.5 + (Math.random() - 0.5)) * 140 * sw;
          ctx.drawImage(src || img, 0, y, 1024, 32, dx, y, 1024, 32);
        }
        ctx.fillStyle = `rgba(255,255,255,${0.6 * sw})`; ctx.fillRect(0, 0, 1024, 768);
        ctx.fillStyle = `rgba(0,0,0,${0.25 * sw})`; for (let y = 0; y < 768; y += 4) ctx.fillRect(0, y, 1024, 2);
      } else ctx.drawImage(img, 0, 0);
    }
    // the backlight coming on
    if (on < 1) { ctx.globalAlpha = (1 - on) * 0.8; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 1024, 768); }
    ctx.globalAlpha = 1;
  }
  tex.needsUpdate = true;
}

window.renderAt = async function (t) {
  // the lid opens, then the screens light up
  const open = ease(clamp01((t - 0.8) / 2.4));
  lidPivot.rotation.x = -open * THREE.MathUtils.degToRad(152);
  const on = clamp01((t - 3.0) / 0.5);
  await drawScreen(0, t, on); await drawScreen(1, t, on);
  screenGlow.intensity = on * 260;
  const top = new THREE.Vector3(0, 40, -30); screenGlow.position.copy(top).add(new THREE.Vector3(0, 30, 40));
  led.material.color.set(on > 0 ? 0x55ff7a : 0x0c2a12);
  // the buttons go down when the themes' scripts press them (a light touch of life)
  for (const b of Object.values(abxy)) b.position.y = FACE + 1.1;
  // the device turns a little on the floor in the last shot
  device.rotation.y = THREE.MathUtils.degToRad(-8 + Math.max(0, t - 29.6) * 5);
  const c = cameraAt(t);
  camera.position.set(...c.pos); camera.lookAt(...c.at);
  const focusTarget = new THREE.Vector3(...c.at);
  bokeh.uniforms.focus.value = camera.position.distanceTo(focusTarget);
  bokeh.uniforms.aperture.value = c.ap;
  film.uniforms.time.value = t;
  film.uniforms.fade.value = clamp01(t / 1.0) * clamp01((DURATION - t) / 0.8);
  film.uniforms.bars.value = 0.06;
  film.uniforms.flash.value = 0;
  for (const [a] of SEG.slice(1)) film.uniforms.flash.value += 0.05 * clamp01(1 - Math.abs(t - a) / 0.15);
  document.getElementById('title').style.opacity = clamp01((t - 30.4) / 1.0);
  composer.render();
  return true;
};
window.DURATION = DURATION;
window.ready = true;
</script></body></html>
