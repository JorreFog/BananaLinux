MEMORY {
    ZP:   start = $00, size = $100, type = rw;
    RAM:  start = $0300, size = $400, type = rw;
    HDR:  start = $0000, size = $10, file = %O, fill = yes;
    PRG0: start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG1: start = $C000, size = $3FFA, file = %O, fill = yes, fillval = $FF;
    VEC:  start = $FFFA, size = 6, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS: load = RAM, type = bss;
    HEADER: load = HDR, type = ro;
    PRG0SEG: load = PRG0, type = ro;
    CODE: load = PRG1, type = ro;
    VECTORS: load = VEC, type = ro;
}
