# ld65 layout: MMC3, 64 KiB PRG (8 x 8 KiB), 64 KiB CHR, 8 KiB battery PRG-RAM
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    OAM:    start = $0200, size = $0100, type = rw;
    RAM:    start = $0300, size = $0500, type = rw;
    HDR:    start = $0000, size = $0010, file = %O, fill = yes;
    PRG0:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG4:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG5:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRGF1:  start = $C000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRGF2:  start = $E000, size = $1FFA, file = %O, fill = yes, fillval = $FF;
    VEC:    start = $FFFA, size = $0006, file = %O, fill = yes;
    CHR:    start = $0000, size = $10000, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    OAM:      load = OAM, type = bss, align = $100;
    BSS:      load = RAM, type = bss;
    HEADER:   load = HDR, type = ro;
    MAP0:     load = PRG0, type = ro;
    MAP1:     load = PRG1, type = ro;
    MAP2:     load = PRG2, type = ro;
    MAP3:     load = PRG3, type = ro;
    BANK4:    load = PRG4, type = ro;
    BANK5:    load = PRG5, type = ro;
    DPCM:     load = PRGF1, type = ro, align = $40;
    RODATA:   load = PRGF1, type = ro;
    CODE:     load = PRGF2, type = ro;
    VECTORS:  load = VEC, type = ro;
    CHRROM:   load = CHR, type = ro;
}
