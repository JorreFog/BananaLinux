<?xml version="1.0" encoding="UTF-8"?>
<systemList>
  <system><name>gba</name><fullname>Game Boy Advance</fullname><path>/storage/roms/gba</path><extension>.gba</extension>
    <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
    <emulators>
      <emulator name="retroarch"><cores><core default="true">mgba</core><core>gpsp</core><core>vbam</core><core>bananagba</core></cores></emulator>
      <emulator name="bananafront"><cores><core>bananafront-bananagba</core><core>bananafront-mgba</core></cores></emulator>
      <emulator name="nanoboyadvance"><cores><core>nanoboyadvance-sa</core></cores></emulator>
    </emulators></system>
  <system><name>gb</name><fullname>Game Boy</fullname><path>/storage/roms/gb</path><extension>.gb</extension>
    <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
    <emulators>
      <emulator name="retroarch"><cores><core default="true">gambatte</core><core>sameboy</core><core>gearboy</core></cores></emulator>
      <emulator name="bananafront"><cores><core>bananafront-gambatte</core></cores></emulator>
    </emulators></system>
  <system><name>snes</name><fullname>Super Nintendo</fullname><path>/storage/roms/snes</path><extension>.sfc</extension>
    <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
    <emulators>
      <emulator name="retroarch"><cores><core default="true">snes9x</core><core>bsnes</core><core>bananasnes</core></cores></emulator>
      <emulator name="bananafront"><cores><core>bananafront-bananasnes</core></cores></emulator>
    </emulators></system>
</systemList>
