<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banana Theme Studio</title>
<!-- Banana Theme Studio: makes a "layout theme" for BananaOS (a theme whose JSON has a "screens" member and draws
     the whole menu). The panels are laid out like the desktop Banana Theme Studio (banana studio/); the look is
     the BananaOS website's (web/preview): charcoal cards, a cream border, banana yellow, Pixelify Sans.
     Open this file straight from the disk (or put the folder on any web host): everything works, including the
     live preview, which is the menu's own engine compiled to WebAssembly (wasm/banana-engine.js). Nothing is
     uploaded. serve.py adds your themes folder and Send to handheld. The format is docs/THEMES.md. -->
<link rel="stylesheet" href="ui.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo-chip"><img src="assets/banana-32.png" alt=""><span class="os">BANANA</span><span class="studio">STUDIO</span></span>
    <span class="sub">layout themes</span>
  </div>
  <div class="tools">
    <button id="newBtn" class="btn">New</button>
    <button id="openBtn" class="btn" title="Open a theme's .json, a .zip with its files, or the .json and its pictures together (Ctrl+O). You can also drop them on the page">Open</button>
    <button id="openDirBtn" class="btn" title="Open a folder: the theme's .json and the pictures, fonts and sounds beside it">Open folder</button>
    <button id="saveBtn" class="btn primary" title="Download the theme's .json (Ctrl+S)">Save</button>
    <button id="exportBtn" class="btn" title="Download a .zip with the theme and every file it names, ready to unzip into banana/themes/ (Ctrl+Shift+S)">Export (.zip)</button>
    <button id="undoBtn" class="btn" title="Undo (Ctrl+Z)" disabled>↶</button>
    <button id="redoBtn" class="btn" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>
    <button id="copyBtn" class="btn" title="Copy the theme's JSON">Copy</button>
    <button id="validateBtn" class="btn">Validate</button>
    <button id="optimizeBtn" class="btn" title="Find what makes the theme slow or battery-hungry on the handheld, and fix it">Optimize</button>
    <button id="templatesBtn" class="btn" title="Start from one of the example themes">Templates</button>
    <button id="guideBtn" class="btn" title="How to make a theme, in plain words, and the full reference">Guide</button>
    <button id="themeSwitch" class="theme-switch" title="The editor's own dark or light look (the theme's own background is under Theme settings > base)"><span class="track"><span class="knob"></span></span><span id="themeLabel">Dark</span></button>
  </div>
  <input id="fileInput" type="file" accept=".json,.zip,application/json,application/zip,.png,.jpg,.jpeg,.ttf,.otf,.wav" multiple class="hidden">
  <input id="dirInput" type="file" webkitdirectory directory multiple class="hidden">
  <span id="status" class="status">…</span>
</header>
<div id="banner" class="banner" hidden></div>

<main class="app">
  <aside class="col left">
    <section class="dock">
      <h2 class="dock-title">Add elements</h2>
      <div class="dock-body" id="palette"></div>
    </section>
    <section class="dock grow">
      <h2 class="dock-title">Layers</h2>
      <div class="dock-body" id="pane-elements"></div>
    </section>
    <section class="dock">
      <div class="tabs" data-group="library">
        <button data-tab="components" aria-selected="true">Components</button>
        <button data-tab="assets">Assets</button>
      </div>
      <div class="dock-body">
        <div id="pane-components"></div>
        <div id="pane-assets" hidden></div>
      </div>
    </section>
  </aside>

  <section class="col center">
    <div class="tabs" data-group="center">
      <button data-tab="design" aria-selected="true">Design</button>
      <button data-tab="json">JSON</button>
    </div>
    <div class="center-body">
      <div id="design"><div id="preview"></div></div>
      <div id="json" hidden></div>
    </div>
  </section>

  <aside class="col right">
    <section class="dock grow">
      <div class="tabs" data-group="properties">
        <button data-tab="inspector" aria-selected="true">Inspector</button>
        <button data-tab="theme">Theme settings</button>
      </div>
      <div class="dock-body">
        <div id="inspector"></div>
        <div id="theme" hidden>
          <div id="pane-theme"></div>
          <div id="pane-vars"></div>
          <div id="pane-colours"></div>
          <div id="pane-icons"></div>
          <div id="pane-input"></div>
          <div id="pane-behaviour"></div>
        </div>
      </div>
    </section>
  </aside>
</main>

<footer class="bottom">
  <div class="tabs" data-group="bottom">
    <button data-tab="controls" aria-selected="true">Preview</button>
    <button data-tab="problems">Problems</button>
  </div>
  <div class="bottom-body">
    <div id="preview-controls"></div>
    <div id="log" hidden></div>
  </div>
</footer>

<!-- classic scripts only, so the page works from file:// (wasm/banana-engine.js is loaded by engine.js when the page
     is up: 3.6 MB, the engine with its fonts and test library inlined) -->
<script src="expr.js"></script>
<script src="schema.js"></script>
<script src="templates.js"></script>
<script src="guide.js"></script>
<script src="zip.js"></script>
<script src="optimize.js"></script>
<script src="engine.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
