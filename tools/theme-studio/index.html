<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banana Theme Studio</title>
<!-- Banana Theme Studio: makes a "layout theme" for BananaOS (a theme whose JSON has a "screens" member and draws
     the whole menu). The panels are laid out like the desktop Banana Theme Studio (banana studio/); the look is
     the BananaOS website's (web/preview): charcoal cards, a cream border, banana yellow, Pixelify Sans.
     Open this file to edit offline; run tools/theme-studio/serve.py for exact previews. The format is docs/THEMES.md. -->
<link rel="stylesheet" href="ui.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo-chip"><img src="assets/banana-32.png" alt=""><span class="os">BANANA</span><span class="studio">STUDIO</span></span>
    <span class="sub">layout themes</span>
  </div>
  <div class="tools">
    <button id="newBtn" class="btn">New</button>
    <button id="openBtn" class="btn">Open</button>
    <button id="saveBtn" class="btn primary">Save</button>
    <button id="copyBtn" class="btn">Copy</button>
    <button id="validateBtn" class="btn">Validate</button>
    <button id="templatesBtn" class="btn" title="Start from one of the example themes">Templates</button>
    <button id="guideBtn" class="btn" title="How to make a theme, in plain words (opens docs/MAKE-A-THEME.md)">Guide</button>
    <button id="themeSwitch" class="theme-switch" title="The editor's own dark or light look (the theme's own background is under Theme settings > base)"><span class="track"><span class="knob"></span></span><span id="themeLabel">Dark</span></button>
  </div>
  <input id="fileInput" type="file" accept=".json,application/json" class="hidden">
  <span id="status" class="status">…</span>
</header>

<main class="app">
  <aside class="col left">
    <section class="dock">
      <h2 class="dock-title">Add elements</h2>
      <div class="dock-body" id="palette"></div>
    </section>
    <section class="dock grow">
      <h2 class="dock-title">Layers</h2>
      <div class="dock-body" id="pane-elements"></div>
    </section>
    <section class="dock">
      <div class="tabs" data-group="library">
        <button data-tab="components" aria-selected="true">Components</button>
        <button data-tab="assets">Assets</button>
      </div>
      <div class="dock-body">
        <div id="pane-components"></div>
        <div id="pane-assets" hidden></div>
      </div>
    </section>
  </aside>

  <section class="col center">
    <div class="tabs" data-group="center">
      <button data-tab="design" aria-selected="true">Design</button>
      <button data-tab="json">JSON</button>
    </div>
    <div class="center-body">
      <div id="design"><div id="preview"></div></div>
      <div id="json" hidden></div>
    </div>
  </section>

  <aside class="col right">
    <section class="dock grow">
      <div class="tabs" data-group="properties">
        <button data-tab="inspector" aria-selected="true">Inspector</button>
        <button data-tab="theme">Theme settings</button>
      </div>
      <div class="dock-body">
        <div id="inspector"></div>
        <div id="theme" hidden>
          <div id="pane-theme"></div>
          <div id="pane-vars"></div>
          <div id="pane-colours"></div>
          <div id="pane-input"></div>
          <div id="pane-behaviour"></div>
        </div>
      </div>
    </section>
  </aside>
</main>

<footer class="bottom">
  <div class="tabs" data-group="bottom">
    <button data-tab="controls" aria-selected="true">Preview</button>
    <button data-tab="problems">Problems</button>
  </div>
  <div class="bottom-body">
    <div id="preview-controls"></div>
    <div id="log" hidden></div>
  </div>
</footer>

<script src="expr.js"></script>
<script src="schema.js"></script>
<script src="templates.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
