name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "Also build the SD card images (an hour or more)"
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libfreetype-dev libdrm-dev libasound2-dev zlib1g-dev imagemagick g++-aarch64-linux-gnu libcurl4-openssl-dev libssh2-1-dev libssl-dev cmake
      # banana-fetch's 7z and RAR checks: the official 7zz (Ubuntu's 7zip has no RAR), the version the image builds
      - name: 7-Zip
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://www.7-zip.org/a/7z2603-linux-x64.tar.xz
          echo "dc99eff5008f1ab79bd7084c68513701547a808a89502bf4133683535ab3c695  7z2603-linux-x64.tar.xz" | sha256sum -c -
          tar -xJf 7z2603-linux-x64.tar.xz 7zz && sudo install -m 755 7zz /usr/local/bin/7zz
      # banana-fetch's SMB: libsmb2 isn't packaged for Ubuntu 24.04, so the release the image builds
      # (buildroot/package/libsmb2, the same archive and hash) is built here, and remote_smb.cpp is compiled and linked
      - name: libsmb2
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o libsmb2-6.2.tar.gz https://github.com/sahlberg/libsmb2/archive/refs/tags/libsmb2-6.2.tar.gz
          echo "8e1f9efc6b2e0f6546f0fe121ac0ddf4fc2f0908ae5a6bd1f185be7c9e0bcbb3  libsmb2-6.2.tar.gz" | sha256sum -c -
          mkdir libsmb2 && tar -xzf libsmb2-6.2.tar.gz -C libsmb2 --strip-components=1
          cmake -S libsmb2 -B libsmb2/build -DENABLE_LIBKRB5=OFF -DENABLE_GSSAPI=OFF -DENABLE_EXAMPLES=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build libsmb2/build -j 4
          sudo cmake --install libsmb2/build && sudo ldconfig
          pkg-config --modversion libsmb2
      - name: banana-ui and banana-fetch (headless test, both panel sizes; Downloads; archives, the session, the runner)
        run: make test
      - name: banana-ui with ALSA
        run: make -C ui clean && make -C ui
      - name: bananad (native and aarch64)
        run: |
          make -C system/bananad CFLAGS="-O2 -Werror"
          make -C system/bananad clean
          make -C system/bananad CC=aarch64-linux-gnu-gcc CFLAGS="-O2 -Werror"
      - name: Sleep (bananad against a made-up /sys in its own namespaces)
        run: sudo system/bananad/tests/sleep-test.sh
      - name: Shell scripts parse
        run: for f in system/rootfs/etc/init.d/* system/rootfs/usr/bin/* system/rootfs/usr/libexec/banana/* system/rootfs/etc/banana/sleep.d/* buildroot/board/rgds/*.sh tools/*.sh; do sh -n "$f" || exit 1; done
      - name: Buildroot defconfigs keep every option
        run: |
          git clone --depth 1 --branch 2026.02.3 https://github.com/buildroot/buildroot /tmp/br
          for d in banana_rgds_defconfig banana_rgds_plus_defconfig banana_universal_defconfig; do
            make -s -C /tmp/br BR2_EXTERNAL=$PWD/buildroot O=/tmp/out-$d $d
            grep -E '^BR2_|^# BR2_.* is not set' buildroot/configs/$d | while IFS= read -r l; do
              grep -qxF "$l" /tmp/out-$d/.config || { echo "$d drops: $l"; exit 1; }
            done
          done

  image:
    if: github.event_name == 'workflow_dispatch' && inputs.image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      matrix:
        board: [rgds, rgds-plus]
    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the toolchain, the kernel, Mesa and RetroArch)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev unzip rsync cpio file wget python3-dev swig libgnutls28-dev
      # downloads and the compiler cache, kept even when the build fails (the next attempt starts from them)
      - name: Restore downloads
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: dl-${{ hashFiles('buildroot/configs/*', 'buildroot/package/**') }}
          restore-keys: dl-
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.board }}-
      - name: Build
        run: make ${{ matrix.board }}
      - name: Save downloads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: dl-${{ hashFiles('buildroot/configs/*', 'buildroot/package/**') }}-${{ matrix.board }}-${{ github.run_id }}
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ matrix.board }}-${{ github.run_id }}
      - name: Build log on failure
        if: failure()
        run: tail -n 200 output/${{ matrix.board }}/build/*/.stamp_* 2>/dev/null | tail -n 50; ls -t output/${{ matrix.board }}/build | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: banana-${{ matrix.board }}
          path: |
            output/${{ matrix.board }}/images/banana-${{ matrix.board }}.img.gz
            output/${{ matrix.board }}/images/banana-${{ matrix.board }}-*.update.tar

  # the whole image booted in QEMU: the first boot makes the data partition, the menu comes up on both panels, a
  # game is started from the library and the menu comes back, a shutdown from the settings powers the VM off; the
  # screenshots and the card's logs are kept as an artifact
  boot:
    if: github.event_name == 'workflow_dispatch' && inputs.image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        board: [rgds, rgds-plus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: banana-${{ matrix.board }}
          path: image
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-utils mtools exfatprogs exfat-fuse
      - name: Boot the image in QEMU
        run: sh tools/qemu-boot.sh image/banana-${{ matrix.board }}.img.gz qemu-out
      - name: Serial log on failure
        if: failure()
        run: tail -n 80 qemu-out/serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-boot-${{ matrix.board }}
          path: |
            qemu-out/*.png
            qemu-out/*.log
