name: Deploy dashboard

on:
  schedule:
    - cron: "0 * * * *" # every hour
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned, assigned, unassigned]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/generate-dashboard-data.mjs"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

# Only keep the latest run; older queued runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate issue snapshot
        run: node scripts/generate-dashboard-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
