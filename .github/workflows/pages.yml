name: Website
# web/ on GitHub Pages: https://jorrefog.github.io/BananaLinux/ (the Save Mover at save-mover/), and the theme
# editor (tools/theme-studio: the page and its scripts, the engine built for the browser) at theme-studio/
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/theme-studio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: The site, and the theme editor in it
        run: |
          mkdir -p _site/theme-studio/wasm
          cp -r web/. _site/
          cd tools/theme-studio
          # what the page loads: no tests, no server, no build scripts
          cp index.html ui.css app.js engine.js expr.js guide.js optimize.js render.js schema.js templates.js zip.js \
             ../../_site/theme-studio/
          cp -r assets ../../_site/theme-studio/
          cp wasm/banana-engine.js ../../_site/theme-studio/wasm/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
