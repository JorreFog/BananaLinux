<?xml version="1.0" encoding="UTF-8"?>
<!-- a sample in the shape ROCKNIX's distributions/ROCKNIX/config/functions (mk_es_systems, add_es_system) writes -->
<systemList>
  <system>
    <name>nds</name>
    <fullname>Nintendo DS</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>2004</release>
    <hardware>portable</hardware>
    <path>/storage/roms/nds</path>
    <extension>.nds .NDS .zip .ZIP .7z</extension>
    <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
    <platform>nds</platform>
    <theme>nds</theme>
    <emulators>
      <emulator name="melonds"><cores><core default="true">melonds-sa</core></cores></emulator>
      <emulator name="retroarch"><cores><core>melondsds</core><core>desmume</core></cores></emulator>
    </emulators>
  </system>
  <system>
    <name>gba</name>
    <fullname>Game Boy Advance</fullname>
    <manufacturer>Nintendo</manufacturer>
    <path>/storage/roms/gba</path>
    <extension>.gba .GBA .zip</extension>
    <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
    <emulators>
      <emulator name="retroarch"><cores><core>gpsp</core><core default="true">mgba</core></cores></emulator>
    </emulators>
  </system>
  <system>
    <name>tools</name>
    <fullname>Tools</fullname>
    <manufacturer>ROCKNIX</manufacturer>
    <path>/storage/roms/tools</path>
    <extension>.sh .SH</extension>
    <command>%ROM%</command>
  </system>
  <system>
    <name>pc</name>
    <fullname>DOS</fullname>
    <manufacturer>Microsoft</manufacturer>
    <path>/storage/roms/pc</path>
    <extension>.com .bat .exe .dosz</extension>
    <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
    <emulators>
      <emulator name="retroarch"><cores><core default="true">dosbox_pure</core><core>dosbox_core</core></cores></emulator>
    </emulators>
  </system>
</systemList>
