<?xml version="1.0" encoding="UTF-8" ?>
<!-- a sample in the shape of ROCKNIX's packages/ui/emulationstation/config/common/es_features.cfg -->
<features>
  <emulator name="melonds">
    <cores>
    <core name="melonds-sa" features="cheevos">
      <features>
      <feature name="screen layout">
        <choice name="Even" value="0"/>
        <choice name="Top emphasis" value="1"/>
      </feature>
      </features>
    </core>
    </cores>
  </emulator>
  <emulator name="retroarch" features="decoration, ratio, smooth, shaders, pixel_perfect, latency_reduction, game_translation">
    <cores>
      <core name="mgba" features="netplay, rewind, autosave, cheevos" />
      <core name="gpsp" features="rewind" />
      <core name="melondsds" features="netplay, rewind, autosave, cheevos" />
    </cores>
  </emulator>
</features>
