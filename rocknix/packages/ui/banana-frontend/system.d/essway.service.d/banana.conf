# BananaOS's menu in EmulationStation's unit too (rocknix-frontend: the menu, or EmulationStation when ROCKNIX's
# banana.frontend setting is 0), for ROCKNIX's scripts that start essway by name to bring the frontend back
[Service]
ExecStart=
ExecStart=/usr/libexec/banana/rocknix-frontend
# (the menu's game control group under the unit's own, for the Thor button's freeze: ui/src/main.cpp gameCgroup)
Delegate=yes
