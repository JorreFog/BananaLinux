# The hardware profile of BananaOS's menu as ROCKNIX's frontend, the part every handheld shares: the system's services
# own the network, Bluetooth, SSH, sharing, updates and the cards (HW_SERVICES=systemd), and the sound is PipeWire's
# (HW_SOUND=pipewire). Installed as /usr/share/banana/rocknix/hw.conf; rocknix-device writes /run/banana/hw.conf (which
# /etc/banana/hw.conf links to) from it and the handheld's own lines after (hw-<board>.conf: the AYN Thor's). What
# depends on the outputs (the top output, the touchscreen, the backlights) is found at the menu's start by
# start_banana.sh. ROCKNIX's own services keep the memory, swap and idle-state tuning (rocknix-memory-manager, its
# 096-cpuidle quirk), so this profile sets none of tune's HW_SYSCTL, HW_ZRAM*, HW_CPUIDLE_OFF or HW_OOM_PROTECT.
HW_NAME=ROCKNIX
HW_SERVICES=systemd
HW_SOUND=pipewire
HW_DEVMGR=
HW_MODULES=
HW_WIFI_MODULE=
HW_PANEL_ROTATE=
# a game's processes: runemu.sh starts each in a scope of ROCKNIX's games.slice (systemd-run), not under the menu's
# unit, and run-pc does the same for PC games; so this is the group to freeze for the menu over a game
HW_GAME_CGROUP=/sys/fs/cgroup/games.slice
# updates: ROCKNIX's own releases would replace this image with ROCKNIX's frontend, so Settings > Update offers none;
# a new build of this image goes in by its update tar in /storage/.update (ROCKNIX installs it at the next boot)
HW_UPDATE=local
