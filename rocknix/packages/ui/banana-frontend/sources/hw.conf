# The hardware profile of BananaOS's menu as ROCKNIX's frontend (installed as /etc/banana/hw.conf by banana-frontend):
# the system's services own the network, Bluetooth, SSH, sharing, updates and the cards (HW_SERVICES=systemd), and the
# sound is PipeWire's (HW_SOUND=pipewire). What depends on the handheld (the top output, the touchscreen, the
# backlights) is found at the menu's start by start_banana.sh.
HW_NAME=ROCKNIX
HW_SERVICES=systemd
HW_SOUND=pipewire
HW_DEVMGR=
HW_MODULES=
HW_WIFI_MODULE=
HW_PANEL_ROTATE=
