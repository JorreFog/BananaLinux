# The AYN Thor's lines of the hardware profile on ROCKNIX (after hw.conf's; rocknix-device adds them when the device
# tree's model is "AYN Thor"). The Buildroot image's etc/banana/hw/thor.conf is the reference; only what applies under
# ROCKNIX is here.
HW_NAME="AYN Thor"
# the fan and the stick lights: usr/libexec/banana/handheld over ROCKNIX's fancontrol and ledcontrol
HW_HANDHELD=yes
# The Thor button under the bottom screen (banana-ui: a press over a game brings the menu up, held 3 s the quick menu
# on the bottom screen), as kernel key codes, comma-separated (one is enough for a menu that reads only the first).
# Under ROCKNIX the pad is InputPlumber's virtual one (02-ayn-thor-controller.yaml, ayn_mcu.yaml): the pad driver's
# BTN_MODE stays BTN_MODE (316) as the DS5's Guide button, and the AYN key on gpio-keys-ayn, KEY_F24 (194), comes out
# of InputPlumber's keyboard as KEY_HOME (102); without InputPlumber, 194 itself. (The driver's other spare key,
# BTN_BACK, comes out as the keyboard's F1, 59.) evtest on the Thor says which one the button is.
HW_HOME=yes
HW_HOME_KEY=316,102,194
# USB debugging: ROCKNIX's USB network (usbgadget) with its sshd, at boot unless the port is in file transfer mode or
# settings.conf says usb_debug = off (usr/libexec/banana/usb-debug)
HW_USB_DEBUG=yes
# tune boot's parts ROCKNIX leaves alone: MGLRU's protection of what was used in the last second, huge pages never
# compacted inside a page fault, the card's scheduler and read-ahead (docs/THOR-TUNING.md)
HW_MGLRU_TTL_MS=1000
HW_THP_DEFRAG=defer
HW_IO="mmcblk=mq-deadline:1024"
