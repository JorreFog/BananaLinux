<?xml version="1.0"?>
<!--
  BananaOS's additions to Mesa's Turnip defaults on the AYN Thor (ROCKNIX's 01-rocknix-turnip.conf).

  tu_autotune_flags "adapt": the GMEM/sysmem choice for each render pass is corrected by the pass's measured time
  (buildroot/patches/mesa3d). TU_AUTOTUNE_FLAGS in a program's environment replaces it.
-->
<driconf>
    <device driver="turnip">
        <application name="all-default">
            <option name="tu_autotune_flags" value="adapt"/>
        </application>
    </device>
</driconf>
