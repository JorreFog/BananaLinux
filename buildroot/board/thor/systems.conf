# Banana's systems: one [id] section each, in shelf order. The id picks the icon and colour in the theme's
# rnds/systems.cfg (nds, gba, snes...). The card's /data/banana/systems.conf is merged over this file per system
# (usr/libexec/banana/systems-merge, at the menu's start, into /run/banana/systems.conf): a [section] there changes only
# the keys it sets for that system and adds a system this file doesn't have; "key =" with nothing takes the key away.
# A value an earlier BananaOS shipped here (etc/banana/systems.history) counts as that old default, not a change.
#
#   name    shown on the shelf            folder  under /data/roms (default: the id)
#   maker   shown under the name          ext     file extensions that are games
#   run     the command; %ROM% is the game (quoted), %SYSTEM% the id
#           (banana:files: the menu's own Files page, not a program)
#           (banana:bshare: the menu's own Bshare page, not a program)
#   perf    the clock profile while it runs (banana-perf): powersave, balanced, steady, performance, superdrastic
#   always  yes: on the shelf with no games, so a fresh card says where the games go
#   flat    yes: games only in the folder itself, not in its subfolders
#   aliases other names a server's folder of its games may have, comma-separated: Files guesses the folder a download
#           goes into by them too (besides the id, the folder and the name; "md, sega genesis")
#   changed a command run in the background when the menu starts, and when something in the folder (or a folder in
#           it, on either card) changes, once the copying has been quiet (a game list or covers made from the games:
#           Game & Watch's names and covers)
#   covers  own: the system makes its own covers (its "changed" command), so the home server's aren't downloaded
#           (set "covers =" in the card's banana/systems.conf to have the server's)
#   folder  may also be an absolute path: an app that comes with the system (/usr/share/banana/apps/<id>)
#
# The AYN Thor's list (board/thor/systems.conf, /etc/banana/systems.conf on the Thor): every system its emulators run,
# in the shelf order of the Thor's design, then BananaOS's own pages and apps as on the RG DS. Which emulator runs what,
# and what each needs from the card: docs/THOR-EMULATORS.md. A system's id is ROCKNIX's (the theme's icons know it);
# the design's short id is first in its aliases.

# BananaNES (FCEUmm's saves and options); the other cores: nestopia, fceumm (core.nes in banana/settings.conf)
[nes]
name = Nintendo Entertainment System
maker = Nintendo
ext = nes fds unf unif zip 7z
run = /usr/libexec/banana/run-retroarch banananes %ROM%
perf = powersave
aliases = nes, famicom, nintendo entertainment system, fds

