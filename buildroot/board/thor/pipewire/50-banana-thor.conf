# PipeWire on the AYN Thor (installed as /etc/pipewire/pipewire.conf.d/50-banana-thor.conf by external.mk). The graph
# keeps PipeWire's own default quantum (1024 frames at 48 kHz, 21 ms) when nothing asks for less, and follows the
# program that asks for the least, as ever; only the floor is raised, from 32 frames (0.7 ms) to 256 (5.3 ms), so no
# program can drive the AudioReach DSP's stream into underruns (crackle) by asking for a latency it can't keep. Below
# what RetroArch asks for at its lowest setting (32 ms): no game is slowed by it. To measure: docs/THOR-TUNING.md.
context.properties = {
    default.clock.min-quantum = 256
}
