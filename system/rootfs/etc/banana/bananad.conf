# bananad: sleep, power and hotkeys. /data/banana/bananad.conf overrides these, line by line.
# Closing the lid sleeps; opening it wakes (yes / no)
lid_sleep = yes
# Minutes without a button press in the menu before sleeping (0: never). Never while a game runs.
autosleep_minutes = 10
# dim_minutes: in the menu, the panels dimmed to dim_percent after this many idle minutes (0: never); back at a press
dim_minutes = 2
dim_percent = 30
# Hold power this long to shut down
power_long_ms = 2000
# deep: suspend to RAM (days of standby); s2idle: lighter, drains more
mem_sleep = deep
# Devices resume in parallel (faster wake-up); bananad falls back to one at a time by itself if a suspend fails
fast_resume = yes
# Asleep, the RTC wakes the handheld this often for a moment to look at the battery (0: never), and it shuts down
# cleanly (the game saves first) when the battery is at or under sleep_poweroff_percent
sleep_check_hours = 4
sleep_poweroff_percent = 5
# The mixer control the volume keys change ("auto": the playing card's own, PCM on the RG DS Plus's speakers,
# Master on the rk817), and by how much
mixer = auto
volume_step = 5
# F + volume: both backlights, in percent of the maximum
brightness_step = 8
# Shut down cleanly at this charge when not on the charger
battery_shutdown_percent = 3
# The LEDs: brightness 0..255 (0: always off); the upper LED turns red at led_low_percent and blinks red at
# led_critical_percent; the lower one is amber while charging
led_brightness = 128
led_low_percent = 20
led_critical_percent = 5
# yes: each sleep's per-device suspend and resume times in banana/logs/sleep-devices.log (finding slow wake-ups)
sleep_debug = no
