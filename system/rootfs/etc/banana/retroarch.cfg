# RetroArch on Banana. Copied to /data/retroarch/retroarch.cfg on first use; RetroArch keeps its changes there.
# The keys run-retroarch forces on every start are here too (video_driver, video_context_driver, video_fullscreen,
# input_driver, audio_driver, audio_device): a card RetroArch wrote itself can hold anything in them -- Video >
# Output > Video Driver set to "null" is a game that runs with no picture at all -- and the launcher puts them back.
# The game runs under cage, a kiosk Wayland compositor: RetroArch draws into a Wayland surface and cage turns the
# output with the panel's own "panel orientation", so the game, RetroArch's menu, its OSD and its widgets all come
# out upright together and video_rotation is 0. (A card with no cage falls back to RetroArch taking the panel
# itself, where run-retroarch sets video_rotation = 3 and the menu rotation patches cover the rest.) The RPC's
# single panel is connector 1; with 2 RetroArch finds no connector and refuses to start the video driver at all.
video_driver = "gl"
video_context_driver = "wayland"
video_monitor_index = "1"
video_fullscreen = "true"
# 0 normal, 1 = 90 degrees, 2 = 180, 3 = 270. screen_orientation rotates BOTH the rgui menu and the game
# viewport; video_rotation alone turns only the viewport. Under cage there is nothing to correct: the compositor
# owns the panel's turn, and on a panel mounted turned in the shell the picture is composed in the shape the user
# is looking at and turned once, at the scanout.
screen_orientation = "0"
video_rotation = "0"
video_vsync = "true"
# Threaded video: the core keeps emulating while the previous frame is blitted to the panel, instead of waiting
# for the present before the next frame. It measured well for SwanStation's *software* renderer (900 frames of
# Crash Bandicoot: 19.96 s -> 16.19 s, ~45 -> ~56 fps), which blocked the software core on the GL present -- but the
# renderer is Vulkan now and threads itself internally, and there the extra thread only adds jitter: counting 100 ms
# windows in which the emulation made no progress at all while a game played, threaded video measured *worse*
# (107 of 150) than unthreaded (22 of 150). Off.
video_threaded = "false"
video_smooth = "false"
video_font_enable = "true"
# two buffers on the panel (the lowest latency KMS gives), no shader pass, nothing costing a frame's work
video_max_swapchain_images = "2"
# Wait for the swapchain image to be free before drawing into it (ROCKNIX sets this on this SoC too) instead of
# racing the previous frame's presentation: with two images and the compositor's own vblank this is what keeps the
# present from missing a frame when the GPU came back late.
video_waitable_swapchains = "true"
# RetroArch's own pop-ups, off where they are noise (ROCKNIX turns these off on this SoC too): "Configuration
# override loaded" (every launch, because Banana keeps its per-core options in an override), "No autoconfig
# profiles found" (the pad is configured by Banana, not autodetected), the remap-load line, and the screenshot
# message and flash. Kept: save states, patches, disk control -- things a player asked for and should see.
notification_show_config_override_load = "false"
notification_show_autoconfig = "false"
notification_show_autoconfig_fails = "false"
notification_show_remap_load = "false"
notification_show_screenshot = "false"
notification_show_screenshot_flash = "0"
notification_show_netplay_extra = "false"
notification_show_when_menu_is_alive = "false"
video_shader_enable = "false"
video_frame_delay = "0"
# nothing running behind the game: no rewind buffer (memory and a copy every frame), no run-ahead (a second
# emulation of every frame), no save-state thumbnails
rewind_enable = "false"
run_ahead_enabled = "false"
savestate_thumbnail_enable = "false"
audio_driver = "alsa"
audio_device = "default"
audio_latency = "48"
# (the RPC's DSP is slow to come up at boot and a lower buffer risks xruns: 48 kept 0 underruns over the software PS1
#  tests, where 32 also measured clean but with no margin left. Raise it if a heavy CD-XA scene ever crackles.)
# no MIDI: this image has no ALSA sequencer (/dev/snd/seq is not built), and RetroArch's driver trying it logs two
# errors and a failed init on every start
midi_driver = "null"
# The emulation is paced by *one* clock, and it is the video's: `audio_sync` makes RetroArch throttle the emulation
# to the audio device instead, which parks it in the audio write whenever the DSP's consumption and the wall clock
# disagree -- and the panel's 60.00 Hz against the PS1's 59.94 gives them something to disagree about all day.
# Measured on the unit (100 ms windows in which the emulation made no progress at all while a game played): both
# syncs on 94 of 150, audio the master 121, the video the master 22. The audio is still correct: audio_rate_control
# resamples it to the device's own rate.
audio_sync = "false"
# RetroArch defaults audio_volume to 0.0 (muted); the ALSA mixer levels run-retroarch sets are downstream of this.
audio_volume = "1.0"
# the joypad: udev (libudev-zero), autoconfigured as ROCKNIX maps it; F is the hotkey
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
# RGUI: RetroArch's pixel menu, at home next to the Pixel look
menu_driver = "rgui"
menu_show_core_updater = "false"
menu_show_online_updater = "true"
libretro_directory = "/usr/lib/libretro"
system_directory = "/data/bios"
savefile_directory = "/data/saves"
savestate_directory = "/data/states"
screenshot_directory = "/data/screenshots"
rgui_config_directory = "/data/retroarch/config"
input_remapping_directory = "/data/retroarch/remaps"
playlist_directory = "/data/retroarch/playlists"
core_options_path = "/data/retroarch/retroarch-core-options.cfg"
cache_directory = "/tmp"
config_save_on_exit = "true"
pause_nonactive = "false"

# the menu's buttons as Banana's own menu has them: A opens, B goes back (RetroArch's default on this build swaps them)
menu_swap_ok_cancel_buttons = "false"
# F + Start quits at once (RetroArch's default asks for a second press)
quit_press_twice = "false"
video_shader_dir = "/usr/share/libretro/shaders/glsl"
# RetroAchievements in Softcore: save states, rewind and cheats stay (RetroArch's default is Hardcore, which locks
# them). Settings > Other systems > RetroAchievements switches it, as RetroArch's own menu does.
cheevos_hardcore_mode_enable = "false"
# Quick resume (Settings > Other systems), off: on, RetroArch saves an automatic state when a game quits and loads it
# when it starts again (run-retroarch keeps savestate_auto_load the same as savestate_auto_save)
savestate_auto_save = "false"
savestate_auto_load = "false"
