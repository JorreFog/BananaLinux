# RetroArch on the RG DS and RG DS Plus. Copied to /data/retroarch/retroarch.cfg on first use; RetroArch keeps its
# changes there. The settings screen's "Screen" (Other systems) sets video_monitor_index.
# One panel through KMS: 2 is the top one (DSI-2), 1 the bottom; the other panel and its backlight are off.
video_driver = "gl"
video_context_driver = "kms"
video_monitor_index = "2"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_font_enable = "true"
audio_driver = "alsa"
audio_device = "default"
audio_latency = "64"
# the joypad: udev (libudev-zero), autoconfigured as ROCKNIX maps it; F is the hotkey
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
# RGUI: RetroArch's pixel menu, at home next to the Pixel look
menu_driver = "rgui"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
libretro_directory = "/usr/lib/libretro"
system_directory = "/data/bios"
savefile_directory = "/data/saves"
savestate_directory = "/data/states"
screenshot_directory = "/data/screenshots"
rgui_config_directory = "/data/retroarch/config"
input_remapping_directory = "/data/retroarch/remaps"
playlist_directory = "/data/retroarch/playlists"
core_options_path = "/data/retroarch/retroarch-core-options.cfg"
cache_directory = "/tmp"
config_save_on_exit = "true"
pause_nonactive = "false"
