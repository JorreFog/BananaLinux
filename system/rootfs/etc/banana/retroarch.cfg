# RetroArch on the RG DS and RG DS Plus. Copied to /data/retroarch/retroarch.cfg on first use; RetroArch keeps its
# changes there. The settings screen's "Screen" (Other systems) sets video_monitor_index.
# One panel through KMS: 2 is the top one (DSI-2), 1 the bottom; the other panel and its backlight are off.
video_driver = "gl"
video_context_driver = "kms"
video_monitor_index = "2"
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_font_enable = "true"
# two buffers on the panel (the lowest latency KMS gives), no shader pass, nothing costing a frame's work
video_max_swapchain_images = "2"
video_shader_enable = "false"
video_frame_delay = "0"
# nothing running behind the game: no rewind buffer (memory and a copy every frame), no run-ahead (a second
# emulation of every frame), no save-state thumbnails
rewind_enable = "false"
run_ahead_enabled = "false"
savestate_thumbnail_enable = "false"
audio_driver = "alsa"
audio_device = "default"
audio_latency = "64"
audio_sync = "true"
# the joypad: udev (libudev-zero), autoconfigured as ROCKNIX maps it; F is the hotkey
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
# RGUI: RetroArch's pixel menu, at home next to the Pixel look
menu_driver = "rgui"
menu_show_core_updater = "false"
menu_show_online_updater = "true"
libretro_directory = "/usr/lib/libretro"
system_directory = "/data/bios"
savefile_directory = "/data/saves"
savestate_directory = "/data/states"
screenshot_directory = "/data/screenshots"
rgui_config_directory = "/data/retroarch/config"
input_remapping_directory = "/data/retroarch/remaps"
playlist_directory = "/data/retroarch/playlists"
core_options_path = "/data/retroarch/retroarch-core-options.cfg"
cache_directory = "/tmp"
config_save_on_exit = "true"
pause_nonactive = "false"

# the menu's buttons as Banana's own menu has them: A opens, B goes back (RetroArch's default on this build swaps them)
menu_swap_ok_cancel_buttons = "false"
# F + Start quits at once, as in the DS emulators (RetroArch's default asks for a second press)
quit_press_twice = "false"
video_shader_dir = "/usr/share/libretro/shaders/glsl"
# RetroAchievements in Softcore: save states, rewind and cheats stay (RetroArch's default is Hardcore, which locks
# them). Settings > Other systems > RetroAchievements switches it, as RetroArch's own menu does.
cheevos_hardcore_mode_enable = "false"
