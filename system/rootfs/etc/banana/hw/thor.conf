# The handheld's hardware as BananaOS's scripts and the menu need it (post-build.sh installs the board's file as
# /etc/banana/hw.conf; shell syntax, read with ". /etc/banana/hw.conf"). The AYN Thor (Snapdragon 8 Gen 2, SM8550),
# from ROCKNIX's qcs8550-ayn-thor.dts. Values marked (check) are from the device tree, not yet seen on a Thor:
# usr/libexec/banana/hw-probe's report on the handheld settles them (docs/THOR-PORT.md, milestone M1).
HW_NAME="AYN Thor"
# the top panel (6" 1080x1920 AMOLED, ICNA3520, mdss_dsi1) and bottom (3.92" 1080x1240, CH13726A, mdss_dsi0): DSI-1 is
# the first DSI host the msm driver registers, dsi0 (check)
HW_TOP=DSI-2
# the bottom touchscreen (FocalTech FT5452) sits behind the I2C hub (i2c_hub_3); the top one (FT5426) on i2c4 (check)
HW_TOUCH=i2c_hub
# both panels are natively portrait, rotation = <90> in the device tree: banana-ui reads the kernel's panel orientation
# when this is empty; "90,90" forces it
HW_PANEL_ROTATE=
# AMOLED panels: their brightness is the DSI panels' own backlight devices (named after the panel nodes) (check)
HW_BACKLIGHT_TOP=
HW_BACKLIGHT_BOTTOM=
# nothing to load by name: udev loads the Wi-Fi's (the WCN7850 on PCIe: ath12k_wifi7 in Linux 7.2) and the rest; the
# GPU (Adreno 740, msm) is built in
HW_MODULES=
HW_WIFI_MODULE=
HW_GPU=freedreno
# the AYN Thor has room for the standard pieces, so it uses them: udev (eudev) loads each device's module and firmware
# and runs the rules, and the sound is a server, PipeWire with WirePlumber, which brings the card (AudioReach on the
# ADSP, the WCD938x, two AW88166) up from its UCM profile (ROCKNIX's) and handles the jack and Bluetooth headphones
HW_DEVMGR=udev
HW_SOUND=pipewire
# compressed swap in memory (rcS, usr/libexec/banana/tune zram), MB or a share of the RAM: half, so the Base (8 GB) gets
# 4 GB and the Max (16 GB) 8 GB, there for the heaviest emulators and PC games; it costs nothing while unused. At most a
# quarter of the RAM holds the compressed pages. Pages go out with LZ4 (fast both ways: a game's own memory comes back
# from it), and those still idle ten minutes later are recompressed with zstd (ROCKNIX's scheme; docs/THOR-TUNING.md)
HW_ZRAM=50%
HW_ZRAM_LIMIT=25%
HW_ZRAM_ALGO=lz4
HW_ZRAM_RECOMPRESS=zstd
# under run-wayland (the compositor around a windowed emulator, the browser, a PC game): how the panels are turned
# there ("" = as the kernel says, "90" or "90,270" = top,bottom) and each touchscreen's name as libinput has it, so a
# touch goes to its own panel (check: `libinput list-devices` on the handheld)
HW_WL_ROTATE=
HW_WL_TOUCH_TOP=
HW_WL_TOUCH_BOTTOM=
# a fan, RGB rings round the sticks and a GPU that clocks higher: usr/libexec/banana/handheld drives them (Settings >
# Sleep & power > Fan, lights & speed), from rcS on
HW_HANDHELD=yes
# the Home button under the bottom screen (the pad's BTN_MODE): pressed in a game, the game stops where it is and the
# menu is up; pressed again, the game goes on. Held three seconds: the quick menu on the bottom screen. (banana-ui)
HW_HOME=yes
# (which button: the kernel's key code. 316 is BTN_MODE, the pad driver's "mode" key; if the button under the screen
# turns out to be its other spare one, BTN_BACK, that is 278. evtest on the pad says which)
HW_HOME_KEY=316
# The kernel's tunables for this handheld (usr/libexec/banana/tune, from rcS; why each, and how to measure it, in
# docs/THOR-TUNING.md). None of them measured on a Thor yet.
# - kswapd starts reclaiming at 1% of the RAM free instead of 0.1% (no stalls in a game's own allocations), dentries and
#   inodes kept longer (the menu's scans of the card), at most 32 MB of unsaved writes before they go out and 128 MB
#   before a writer waits (the card writes 20-60 MB/s: a share of 16 GB would be seconds of stall), and programs may
#   reserve more than the RAM (Box64 and Wine map large areas they never fill; ROCKNIX's SM8550 setting)
HW_SYSCTL="vm.watermark_scale_factor=100 vm.vfs_cache_pressure=50 vm.dirty_background_bytes=33554432 vm.dirty_bytes=134217728 vm.overcommit_memory=1"
# MGLRU: what was used in the last second is never evicted (a thrashing game is killed instead of freezing everything)
HW_MGLRU_TTL_MS=1000
# huge pages where a program asks for them, never by compacting memory inside a page fault
HW_THP_DEFRAG=defer
# cpu0's first power-collapse state off: ROCKNIX's SM8550 quirk (096-cpuidle: "seems to cause GMU issues", the GPU's
# management unit)
HW_CPUIDLE_OFF="cpu0/state1"
# the card: mq-deadline (reads ahead of the writes a save makes), 1 MB read-ahead for ROMs and disc images
HW_IO="mmcblk=mq-deadline:1024"
# never the OOM killer's choice: the device manager, D-Bus, bananad (keys, sleep), the log; PipeWire and WirePlumber
# are protected by sound-server as it starts them. The game is the one to go
HW_OOM_PROTECT="udevd dbus-daemon bananad syslogd"
# in every program's environment (hw-env), unless a launcher sets its own: caches on the card (init's HOME is the
# read-only root, so a program started without a HOME of its own, SuperDrastic or BananaFront, had no Mesa shader cache
# and compiled every shader at every start), and glibc's malloc asking for huge pages for its heaps (fewer TLB misses in
# an emulator's or Box64's big heap)
HW_ENV="XDG_CACHE_HOME=/data/banana/cache GLIBC_TUNABLES=glibc.malloc.hugetlb=1"
# USB debugging (usr/libexec/banana/usb-debug): a computer plugged into the USB-C port has complete access with no
# password, as a network card (ssh root@10.55.0.1), a serial console and adb. On for bringing the Thor up; take this
# line out of an image meant for others, or turn it off on a card with "usb_debug = off" in banana/settings.conf.
HW_USB_DEBUG=yes
