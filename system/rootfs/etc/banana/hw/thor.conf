# The handheld's hardware as BananaOS's scripts and the menu need it (post-build.sh installs the board's file as
# /etc/banana/hw.conf; shell syntax, read with ". /etc/banana/hw.conf"). The AYN Thor (Snapdragon 8 Gen 2, SM8550),
# from ROCKNIX's qcs8550-ayn-thor.dts. Values marked (check) are from the device tree, not yet seen on a Thor:
# usr/libexec/banana/hw-probe's report on the handheld settles them (docs/THOR-PORT.md, milestone M1).
HW_NAME="AYN Thor"
# the top panel (6" 1080x1920 AMOLED, ICNA3520, mdss_dsi1) and bottom (3.92" 1080x1240, CH13726A, mdss_dsi0): DSI-1 is
# the first DSI host the msm driver registers, dsi0 (check)
HW_TOP=DSI-2
# the bottom touchscreen (FocalTech FT5452) sits behind the I2C hub (i2c_hub_3); the top one (FT5426) on i2c4 (check)
HW_TOUCH=i2c_hub
# both panels are natively portrait, rotation = <90> in the device tree: banana-ui reads the kernel's panel orientation
# when this is empty; "90,90" forces it
HW_PANEL_ROTATE=
# AMOLED panels: their brightness is the DSI panels' own backlight devices (named after the panel nodes) (check)
HW_BACKLIGHT_TOP=
HW_BACKLIGHT_BOTTOM=
# nothing to load by name: udev loads the Wi-Fi's (the WCN7850 on PCIe: ath12k_wifi7 in Linux 7.2) and the rest; the
# GPU (Adreno 740, msm) is built in
HW_MODULES=
HW_WIFI_MODULE=
HW_GPU=freedreno
# the AYN Thor has room for the standard pieces, so it uses them: udev (eudev) loads each device's module and firmware
# and runs the rules, and the sound is a server, PipeWire with WirePlumber, which brings the card (AudioReach on the
# ADSP, the WCD938x, two AW88166) up from its UCM profile (ROCKNIX's) and handles the jack and Bluetooth headphones
HW_DEVMGR=udev
HW_SOUND=pipewire
# compressed swap in memory, MB (rcS): a quarter of the Base's 8 GB, there for the heaviest emulators and PC games;
# costs nothing while unused
HW_ZRAM=2048
# under run-wayland (the compositor around a windowed emulator, the browser, a PC game): how the panels are turned
# there ("" = as the kernel says, "90" or "90,270" = top,bottom) and each touchscreen's name as libinput has it, so a
# touch goes to its own panel (check: `libinput list-devices` on the handheld)
HW_WL_ROTATE=
HW_WL_TOUCH_TOP=
HW_WL_TOUCH_BOTTOM=
# a fan, RGB rings round the sticks and a GPU that clocks higher: usr/libexec/banana/handheld drives them (Settings >
# Sleep & power > Fan, lights & speed), from rcS on
HW_HANDHELD=yes
