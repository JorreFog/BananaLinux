# The handheld's hardware as BananaOS's scripts and the menu need it (post-build.sh installs the board's file as
# /etc/banana/hw.conf; shell syntax, read with ". /etc/banana/hw.conf"). The Anbernic RG DS and RG DS Plus (RK3568).
HW_NAME="Anbernic RG DS"   # (universal: the RG DS or RG DS Plus, the same hardware here)
# the top panel's DRM connector, and a part of the bottom touchscreen's sysfs path (banana-ui's BANANA_TOP,
# BANANA_TOUCH; the kernel's banana.top= and banana.touch= still win)
HW_TOP=DSI-2
HW_TOUCH=fe5e0000.i2c
# how each panel is mounted, clockwise degrees "<top>,<bottom>" (BANANA_PANEL_ROTATE); empty: the kernel's panel
# orientation (none on the RG DS)
HW_PANEL_ROTATE=
# the backlights of the top and the bottom panel (/sys/class/backlight)
HW_BACKLIGHT_TOP=backlight1
HW_BACKLIGHT_BOTTOM=backlight0
# modules loaded after the menu's first frame (rcS): the GPU and the Wi-Fi
HW_MODULES="panfrost rtw88_8821cs"
# the Wi-Fi's module, unloaded around sleep (sleep.d/10-wifi); empty: left loaded
HW_WIFI_MODULE=rtw88_8821cs
# the GPU's Mesa driver (for programs that ask: MESA_LOADER_DRIVER_OVERRIDE is never set)
HW_GPU=panfrost
# no udev (devtmpfs alone: the drivers are built in, rcS loads the two modules above) and no sound server (bananad
# drives the cards itself)
HW_DEVMGR=
HW_SOUND=
