# banana-ui. Copied to /data/banana/settings.conf on the first boot: change it there.
# theme: dark or light (ROCKNIXDS Pixel's two palettes)
theme = dark
# motion: off holds the top screen still (no bob), a little less battery
motion = on
# sounds: the menu's sounds
sounds = on
# battery: on the top screen, icon or percent (icon and percentage)
battery = icon
# clock: 24h or 12h
clock = 24h
# splash: the boot animation (on), or straight to the menu once it is ready (off)
splash = on
# wifi: on joins the network in banana/wifi.conf at boot; off leaves Wi-Fi down
wifi = on
# quick_resume: on keeps your place when a DS game quits (it goes on from there next time); off ends it
quick_resume = off
# nds_emulator: superdrastic (DraStic through SuperDrastic) or bananads (BananaDS)
nds_emulator = superdrastic
# share: the card's data partition on the network over SMB (\\<address>\banana), no password
share = off
# ssh: root over SSH with the keys in banana/ssh/authorized_keys (no passwords), for working on Banana itself
ssh = off
# timezone: a POSIX TZ rule (the settings screen lists the common ones; any rule glibc reads works here)
timezone = UTC0
# retroarch_panel: panel shows a RetroArch game's achievements and touch tiles on the screen it doesn't use; off leaves it dark
retroarch_panel = panel
