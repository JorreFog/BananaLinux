# banana-ui. Copied to /data/banana/settings.conf on the first boot: change it there.
# theme: dark or light (ROCKNIXDS Pixel's two palettes)
theme = dark
# accent: the colour of the selection, the logo and the boot animation's banana (yellow, blue, red, green, purple, pink)
accent = yellow
# motion: off holds the top screen still (no bob), a little less battery
motion = on
# sounds: the menu's sounds
sounds = on
# battery: on the top screen, icon or percent (icon and percentage)
battery = icon
# clock: 24h or 12h
clock = 24h
# splash: the boot animation (on), or straight to the menu once it is ready (off)
splash = on
# bottom_idle_mode: while a RetroArch game runs on the top screen (its game panel on the bottom), what the bottom
# screen does after bottom_idle_seconds with no touch and no button: dim (to bottom_dim_percent of its brightness), off
# (its backlight off) or on (stays on); a touch or any button lights it again
bottom_idle_mode = dim
bottom_idle_seconds = 30
bottom_dim_percent = 25
# wifi: on joins the network in banana/wifi.conf at boot; off leaves Wi-Fi down
wifi = on
# bluetooth: on starts Bluetooth at boot (controllers, headphones; Settings > Network > Bluetooth devices pairs them);
# off (the default) leaves the chip's Bluetooth unpowered
bluetooth = off
# quick_resume: on keeps your place when a DS game quits (it goes on from there next time); off ends it
quick_resume = off
# sd2_roms: on shows the games on the second SD card (the RG DS Plus's second slot: roms/<system> on it, as here)
# in the library while it's in; off leaves that card alone
sd2_roms = on
# ra_shader: the look of RetroArch's games (Settings > Other systems > Shader): off, lcd, crt or sharp
ra_shader = off
# ra_audio_latency: RetroArch's audio buffer in milliseconds: 32 (lowest latency), 64 (the default) or 128 (safest)
ra_audio_latency = 64
# ra_vsync: on waits for the panel's refresh before drawing the next frame; off lets RetroArch run unthrottled
ra_vsync = on
# nds_emulator: superdrastic (DraStic through SuperDrastic) or bananads (BananaDS)
nds_emulator = superdrastic
# share: the card's data partition on the network over SMB (\\<address>\banana)
share = off
# share_login: password (the name and password in Settings > Network, banana and linux at first) or guest (no password)
share_login = password
# ssh: root over SSH with the keys in banana/ssh/authorized_keys (no passwords), for working on Banana itself
ssh = off
# timezone: a POSIX TZ rule (the settings screen lists the common ones; any rule glibc reads works here)
timezone = UTC0
# retroarch_panel: panel shows a RetroArch game's achievements and touch tiles on the screen it doesn't use; off leaves it dark
retroarch_panel = panel
# pokemon_companion: on shows the party and battles of a GBA Pokémon game (the English Ruby to LeafGreen) on the game panel
pokemon_companion = off
# core.<system>: the RetroArch core for that system when another is installed (Settings > Other systems); a system
# with no line uses the core its systems.conf run line names, and run-retroarch ignores one that isn't installed
core.gba = gpsp
# boxart_source: libretro, both (TwilightBoxart for libretro's misses) or twilight (TwilightBoxart first);
# boxart_twilight_url: the TwilightBoxart server (KirovAir/TwilightBoxart's API)
boxart_source = libretro
boxart_twilight_url = https://boxart.kirovair.com
# boxart_twilight_key: its API key (public: its web client's), replaced here if the server's changes
boxart_twilight_key = tb2_9f4c1d7a3e8b5062
