# Banana: the sound goes through PipeWire. ALSA's default PCM is PipeWire's plugin, so the menu, a game and
# anything else mix in one stream, and the card's one frontend belongs to PipeWire -- which rcS starts after the
# route and the levels are set, and which opens the hardware with them (see rcS and bananad). bananad still writes
# /run/banana/asound.conf: that is the same device spelled out for anything that opens the hardware directly, and it
# is what this file used to be a link to.
pcm.!default { type pipewire }
