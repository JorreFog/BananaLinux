# BlueZ's settings on Banana. bluetoothd runs only while Bluetooth is on (Settings > Network > Bluetooth, started by
# /usr/libexec/banana/bluetooth); the pairings live in /run/banana/bluetooth and are kept on the card as
# banana/bluetooth.tar (exFAT can't hold BlueZ's AA:BB:CC:... folder names).
[General]
Name = BananaOS
# a device the menu found stays known this long after the search (so A can still pair with it)
TemporaryTimeout = 120
# a controller or headphones paired with another console in between pair again without a question
JustWorksRepairing = always
# not discoverable: the handheld finds the devices, the devices don't need to find it
DiscoverableTimeout = 0

[Policy]
# powered as soon as bluetoothd starts (Bluetooth on in Settings)
AutoEnable = true
# a link lost (out of range): headphones are called back a few times
ReconnectAttempts = 4
ReconnectIntervals = 1,2,4,8
