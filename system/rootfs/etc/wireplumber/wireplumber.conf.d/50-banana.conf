# Banana: the card has no UCM profile (this image has no alsa-ucm-conf), so ACP's own "pro-audio" profile is what
# exposes its PCMs -- and without a profile selected the card has no sinks at all: PipeWire comes up, the menu and
# the games open streams, and nothing is ever played. ROCKNIX sets the same profile for its UCM-less cards. The
# card's first playback PCM (MultiMedia1) is the one bananad's volume keys change, so it is made the default sink
# by priority.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card._sys_devices_platform_sound_sound_card0*" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
  {
    matches = [ { node.name = "~alsa_output._sys_devices_platform_sound_sound_card0.pro-output-0" } ]
    actions = { update-props = { priority.driver = 1200, priority.session = 1200 } }
  }
]
