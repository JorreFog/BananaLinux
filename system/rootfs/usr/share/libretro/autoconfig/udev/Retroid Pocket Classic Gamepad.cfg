# The Retroid Pocket Classic's pad (the rsinput MCU driver, "Retroid Pocket Classic Gamepad"): BTN_BACK,
# BTN_SOUTH/EAST/NORTH/WEST, TL/TR, TL2/TR2, SELECT, START, MODE, THUMBL/THUMBR and BTN_DPAD_*.
#
# RetroArch's udev driver numbers a pad's buttons in the order it finds them -- KEY_UP..KEY_DOWN first, then
# BTN_MISC and up -- so with BTN_BACK (278) present the indices are: 0 BTN_BACK, 1 SOUTH, 2 EAST, 3 NORTH,
# 4 WEST, 5 TL, 6 TR, 7 TL2, 8 TR2, 9 SELECT, 10 START, 11 MODE, 12 THUMBL, 13 THUMBR, 14..17 the d-pad.
# This pad has no analogue sticks (ABS_X/Y are unused), so no axis binds.
#
# The button under the screen is BTN_MODE (11) and is RetroArch's hotkey *and* its menu toggle: RetroArch only acts
# on menu_toggle while the hotkey is held, so binding both to that one button makes a single press open the menu.
# With it held: +Start quits, +L/R load/save a state, +L2/R2 rewind/fast-forward, +Y the FPS counter.
#
# Audit (2026): the rsinput driver's button order (buildroot/board/retroid-pocket-classic/linux-patches/0016 and
# 0059) is byte-identical to ROCKNIX's SM4450 device patches, and the indices below are exactly what RetroArch's udev
# driver assigns (udev_joypad.c: KEY_UP..KEY_DOWN, then BTN_MISC..KEY_MAX in code order -- BTN_BACK 278, SOUTH 304,
# EAST 305, NORTH 307, WEST 308, TL 310, TR 311, TL2 312, TR2 313, SELECT 314, START 315, MODE 316, THUMBL 317,
# THUMBR 318, then the BTN_DPAD_* at 544..547). Start and Select are not swapped, and the digital triggers (TL2/TR2)
# do not collide with them. banana-ui reads BTN_SELECT/BTN_START directly, so the menu follows the same mapping.
input_driver = "udev"
input_device = "Retroid Pocket Classic Gamepad"
input_vendor_id = "12068"
input_product_id = "1"
input_analog_dpad_mode = "0"
input_joypad_index = "0"
input_mouse_index = "0"
input_b_btn = "1"
input_a_btn = "2"
input_x_btn = "3"
input_y_btn = "4"
input_l_btn = "5"
input_r_btn = "6"
input_l2_btn = "7"
input_r2_btn = "8"
input_l3_btn = "12"
input_r3_btn = "13"
input_select_btn = "9"
input_start_btn = "10"
input_up_btn = "14"
input_down_btn = "15"
input_left_btn = "16"
input_right_btn = "17"
input_enable_hotkey_btn = "11"
input_exit_emulator_btn = "10"
input_menu_toggle_btn = "11"
input_load_state_btn = "5"
input_save_state_btn = "6"
input_rewind_btn = "7"
input_toggle_fast_forward_btn = "8"
input_fps_toggle_btn = "4"
input_screenshot_btn = "nul"
input_pause_toggle_btn = "nul"
input_state_slot_increase_btn = "nul"
input_state_slot_decrease_btn = "nul"
input_exit_emulator = "escape"
input_menu_toggle = "f1"
input_select = "rshift"
input_start = "enter"
input_up = "up"
input_down = "down"
input_left = "left"
input_right = "right"
input_a = "x"
input_b = "z"
input_x = "s"
input_y = "a"
input_l = "q"
input_r = "w"
