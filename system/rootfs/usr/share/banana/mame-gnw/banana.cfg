<?xml version="1.0"?>
<!-- The RG DS's pad for every Game & Watch: Start = Game A, Select = Game B, L = Time, R = Alarm; a right-hand
     up/down pair (Mario Bros.) on X (top) and B (bottom), the pad's own up/down. MAME's sdlgame provider numbers the
     pad's A B X Y L R as BUTTON1-6 (the pad's SDL mapping follows its labels); otherwise MAME's own defaults -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="START1"><newseq type="standard">KEYCODE_1 OR JOYCODE_1_START</newseq></port>
            <port type="START2"><newseq type="standard">KEYCODE_2 OR JOYCODE_1_SELECT</newseq></port>
            <port type="P1_SELECT"><newseq type="standard">KEYCODE_5 OR JOYCODE_1_BUTTON5</newseq></port>
            <port type="P1_JOYSTICKRIGHT_UP"><newseq type="standard">KEYCODE_I OR JOYCODE_1_BUTTON3</newseq></port>
            <port type="P1_JOYSTICKRIGHT_DOWN"><newseq type="standard">KEYCODE_K OR JOYCODE_1_BUTTON2</newseq></port>
            <port type="SERVICE2"><newseq type="standard">KEYCODE_0 OR JOYCODE_1_BUTTON6</newseq></port>
        </input>
    </system>
</mameconfig>
