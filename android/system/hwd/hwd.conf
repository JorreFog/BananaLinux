# banana-hwd's configuration (/system_ext/etc/banana/hwd.conf). "key = value"; a key left out or empty is found by
# looking, which covers both kernels the Thor runs:
#   AYN's Qualcomm 5.15 kernel (LineageOS/android_kernel_ayn_qcs8550: what LineageOS 24 for the Thor, odin2thor, uses)
#   mainline with ROCKNIX's device tree (BananaOS's Linux image)
# Paths are relative to /sys. Every value below marked (measured) was read on a Thor under LineageOS by others
# (LineageOS's hardware/ayn sources, Wingdom/thor-features' notes); (dt) comes from a device tree; (guess) is neither.

# The fan.
#   trips  AYN's kernel: the fan is a cooling device (type pwm-fan, max_state 8) the step_wise governor drives from
#          several zones; pwm1 written by hand is undone at the next evaluation, so a profile moves the trips bound
#          to it (measured: thor-features/thor-fanctl). Found by type, never by number (cooling_deviceN moves).
#   pwm    mainline with ROCKNIX's device tree: nothing maps a zone to the fan, so the daemon runs ROCKNIX's curve on
#          pwm1 itself (dt; BananaOS's usr/libexec/banana/handheld)
#   auto   trips if any trip is bound to a pwm-fan cooling device, else pwm if a pwm1 exists
fan_backend = auto
# pwm1 for reading the fan's drive (AYN's kernel: hwmon0, the only hwmon, measured; no fan1_input, no RPM)
fan_pwm =
fan_interval_ms = 3000

# The stick lights (class/leds names, space separated). Empty: AYN's left:stick:0-3 right:stick:0-3 (one per LED,
# multi_intensity "R G B"; LineageOS hardware/ayn AynParts and charger_rgb), else left:stick right:stick, plus
# left:strip right:strip where present; else ROCKNIX's rgb:l1-4 rgb:r1-4 (channels wired B G R).
led_nodes =
# auto: rgb for AYN's names, bgr for rgb:*
led_order = auto

# The panels' backlights (class/backlight names). Empty: panel0-backlight (top, 6") and panel1-backlight (bottom,
# 3.92") on AYN's kernel (measured: thor-screenblank paired them on hardware; device init.qcom.rc chowns both), else
# ae96000.dsi.0 / ae94000.dsi.0 on mainline (dt, unverified).
backlight_top =
backlight_bottom =

# The GPU's devfreq directory. Empty: class/kgsl/kgsl-3d0/devfreq on AYN's kernel (kgsl), else class/devfreq/*.gpu.
gpu_devfreq =
# The raised top clock "GPUBOOST on" sets, only offered where available_frequencies lists it (mainline's table for
# the Adreno 740 ends at 680 MHz; AYN's kgsl table is not known here)
gpu_boost_hz = 1000000000
gpu_stock_hz = 680000000

# The Home (AYN) button under the bottom screen: KEY_F24 (194) on the "gpio-keys" device (measured:
# thor-features/thor-aynkey; the device tree's "AYN Key" on tlmm 41). The pad also sends BTN_MODE (316) and
# KEY_HOME (102) for its own buttons; add them here to make those the menu's too ("194,316").
home_keys = 194
home_devices = gpio-keys
# held this long: "EVENT home hold" (the quick menu), while still held
home_hold_ms = 3000

# where the settings are kept (fan profile, lights, clock profile)
state_file = /data/misc/banana/hwd.state
