# BananaOS on Android: how the launcher starts a game of each system in buildroot/board/thor/systems.conf.
# In the Android tree: vendor/banana/android/system/launch.conf. The launcher (android/launcher) reads it; banana-hwd
# is told the game's system and clock profile separately (GAME START, android/system/hwd/PROTOCOL.md).
#
# One [section] per system id. Keys:
#   package    the app. Two special values: banana:<page> is one of the launcher's own pages (as systems.conf's
#              run = banana:files), and none means the system has no Android route: the launcher hides its shelf
#   activity   the component's class (optional: without it, the package's launch intent with the action below)
#   action     the Intent action (default android.intent.action.VIEW)
#   data       none | file | content, or a URI template:
#                file     Uri.fromFile(<ROM path>)
#                content  the ROM's FileProvider URI (the launcher's provider), with FLAG_GRANT_READ_URI_PERMISSION
#                         added by the launcher, and ClipData set to the same URI so the grant also covers it there
#                <template>  any other value is a URI with the placeholders below filled in (e.g. scummvm:%ROMTEXT%)
#   mime       the data's MIME type (optional; setDataAndType)
#   flags      Intent flag names, space separated (FLAG_ACTIVITY_NEW_TASK and so on)
#   core       the RetroArch core's name, for %CORE%
#   extra.<name> = <value>   a string extra. Placeholders:
#                %ROM%      the ROM's absolute path        %ROMURI%   its content URI (as for data = content)
#                %CORE%     the section's core             %ROMTEXT%  the ROM file's first non-empty line, trimmed
#                %ROMKEY:<k>%  the value of "<k> = <value>" in the ROM file (a PC game's .pc file: steam = 1145360)
#              (%ROMTEXT% and %ROMKEY% are additions to the first agreed format, for Vita3K, ScummVM and GameNative,
#              whose games are named by an id written in a small file, as on the Linux image)
#   [<id>.<variant>]  an alternative for the same system that the launcher may offer (Settings > emulator); the plain
#              [<id>] is the default
#
# Sources: every package, activity, action and extra below was read in the emulator's own source at the version in
# android/system/emulators/fetch.sh, file by file (named in each section); "ES-DE" means the Android configuration of
# ES-DE (gitlab.com/es-de/emulationstation-de, resources/systems/android/es_systems.xml and es_find_rules.xml, master
# of 2026-11-14), read as a second opinion. (unverified) marks what has not been run on Android by anyone here.
#
# RetroArch (com.retroarch.aarch64, 1.22.2 from buildbot.libretro.com):
#   RetroActivityFuture is exported (pkg/android/phoenix/AndroidManifest.xml at v1.22.2); the native side reads the
#   string extras CONFIGFILE, LIBRETRO, ROM, IME, DATADIR, SDCARD, APK, EXTERNAL (frontend/drivers/platform_unix.c,
#   the getStringExtra calls), and its Java side QUITFOCUS and REFRESH
#   (pkg/android/phoenix/src/com/retroarch/browser/retroactivity/RetroActivityFuture.java). A different ROM or core
#   sent to a running RetroArch restarts it (onNewIntent there). CONFIGFILE given also skips the all-files-access
#   prompt at start (RetroActivityCommon.java at master; the ROM must then grant MANAGE_EXTERNAL_STORAGE itself:
#   docs/THOR-LINEAGE-PARITY.md).
#   Cores live in /data/data/com.retroarch.aarch64/cores/<name>_libretro_android.so (UserPreferences.java,
#   InstalledCoresReceiver.java). The APK has none: they come from RetroArch's own Online Updater (buildbot's
#   nightly/android/latest/arm64-v8a, where every core named below was listed on 2026-11-14), or the launcher hands
#   each one to RetroArch's exported CoreSideloadActivity (extra LIBRETRO = a core file it can read: it copies it into
#   cores/; pkg/android/phoenix/src/com/retroarch/browser/debug/CoreSideloadActivity.java at v1.22.2; at master that
#   activity is only in debug builds). QUITFOCUS is not passed: RetroArch would quit when the Home button brings the
#   menu up, where the Linux image froze the game.
#   BananaOS's own cores (BananaNES, BananaSNES, BananaGBA) have no Android build: the cores they derive from stand in.

[nes]
# Linux: BananaNES (FCEUmm-based). Here FCEUmm itself
package = com.retroarch.aarch64
activity = com.retroarch.browser.retroactivity.RetroActivityFuture
action = android.intent.action.MAIN
data = none
flags = FLAG_ACTIVITY_NEW_TASK
core = fceumm
extra.ROM = %ROM%
extra.LIBRETRO = /data/data/com.retroarch.aarch64/cores/%CORE%_libretro_android.so
extra.CONFIGFILE = /storage/emulated/0/Android/data/com.retroarch.aarch64/files/retroarch.cfg

