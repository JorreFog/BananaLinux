[ps2]
# ARMSX2 2.9.3 (com.armsx2, the a15 build): the alias .MainActivity (target .Main) is exported for VIEW of content
# and file URIs (platforms/android/app/src/main/AndroidManifest.xml); handleExternalLaunchIntent takes the data URI,
# else EXTRA_STREAM, ClipData, or the string extras path/game/rom/uri, and turns a .cue into its first track
# (platforms/android/app/src/main/java/com/armsx2/runtime/MainActivityRuntime.kt). ES-DE the same
package = com.armsx2
activity = com.armsx2.MainActivity
action = android.intent.action.VIEW
data = content
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK FLAG_GRANT_READ_URI_PERMISSION

[psp]
# PPSSPP 1.20.4 (org.ppsspp.ppsspp): PpssppActivity is exported for VIEW of file and content URIs (android/
# AndroidManifest.xml); parseIntent passes the data URI to the native side as the game to boot
# (android/src/org/ppsspp/ppsspp/PpssppActivity.java). Without data, the extra org.ppsspp.ppsspp.Shortcuts (a path)
# does the same
package = org.ppsspp.ppsspp
activity = org.ppsspp.ppsspp.PpssppActivity
action = android.intent.action.VIEW
data = content
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK FLAG_GRANT_READ_URI_PERMISSION

[psvita]
# Vita3K (org.vita3k.emulator, build 4338): the SDL activity .Emulator is exported (android/app/src/main/
# AndroidManifest.xml) and boots an installed game from the string extra title_id ("-r <id>"), or takes its
# arguments from the string-array extra AppStartParameters, which ES-DE uses (android/app/src/main/java/org/vita3k/
# emulator/Emulator.java, getArguments). As on Linux, a game is a <title>.psvita file holding its title ID; a .vpk,
# .zip or .pkg is installed once from Vita3K's own menu (no install by intent), which is where the Vita's firmware
# goes too
package = org.vita3k.emulator
activity = org.vita3k.emulator.Emulator
action = android.intent.action.MAIN
data = none
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK
extra.title_id = %ROMTEXT%

