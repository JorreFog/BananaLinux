[gamecube]
# Dolphin 2609b: MainActivity (exported, Source/Android/app/src/main/AndroidManifest.xml) hands what its intent names
# to EmulationActivity: the data URI (content, scoped storage), else the extra AutoStartFile (a path)
# (Source/Android/app/src/main/java/org/dolphinemu/dolphinemu/utils/StartupHandler.kt, getGamesFromIntent). ES-DE
# uses AutoStartFile with TvMainActivity, the same handler. A .m3u: Dolphin takes several discs only as ClipData
# (unverified for .m3u: the launcher would have to expand it)
package = org.dolphinemu.dolphinemu
activity = org.dolphinemu.dolphinemu.ui.main.MainActivity
action = android.intent.action.MAIN
data = content
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK FLAG_GRANT_READ_URI_PERMISSION
extra.AutoStartFile = %ROM%

