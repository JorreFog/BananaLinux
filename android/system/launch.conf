[scummvm.standalone]
# ScummVM 2026.3.0 (org.scummvm.scummvm): only SplashActivity is exported; it passes its intent's action and data on
# to ScummVMActivity (backends/platform/android/org/scummvm/scummvm/SplashActivity.java, fillIn), which starts
# ScummVM with the data's scheme-specific part as the target (ScummVMActivity.java, "intentData.getSchemeSpecificPart"),
# the same form as its own home-screen shortcuts, scummvm:<target> (ShortcutCreatorActivity.java). The target must
# already be in ScummVM's list (added once from its own menu): no path, no detection, by intent
package = org.scummvm.scummvm
activity = org.scummvm.scummvm.SplashActivity
action = android.intent.action.MAIN
data = scummvm:%ROMTEXT%
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK

[pc]
# PC games: GameNative 1.4.0 (app.gamenative, GPL-3.0; Steam, Epic, GOG and Amazon libraries, Wine with Box64/FEX,
# Steam's QR login). MainActivity is exported for VIEW of gamenative://run (app/src/main/AndroidManifest.xml);
# IntentLaunchManager.parseLaunchIntent takes appid, gamesource (STEAM, EPIC, GOG, AMAZON, CUSTOM_GAME) and exe /
# exec_args from the URI's query, or the extras app_id (an int), game_source, exe, exec_args, container_config
# with the action app.gamenative.LAUNCH_GAME (app/src/main/java/app/gamenative/utils/IntentLaunchManager.kt at
# v1.4.0). The URI form is used because this table's extras are strings. A game is the .pc file of the Linux image
# with a "steam = <app id>" line: GameNative downloads it the first time (its own download, in its own storage), then
# runs it. A game copied to the card by hand has no Android route here: it is added to GameNative as a custom game
# from its own menu (unverified: launching one by exe=)
package = app.gamenative
activity = app.gamenative.MainActivity
action = android.intent.action.VIEW
data = gamenative://run?appid=%ROMKEY:steam%&gamesource=STEAM
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_SINGLE_TOP

[pc.winlator]
# Winlator 11.2 (com.winlator): its game activity, XServerDisplayActivity, is not exported upstream
# (brunodev85/winlator-app app/src/main/AndroidManifest.xml), so another app can only open Winlator itself; its
# shortcuts are its own. (Winlator's forks that export it, with an extra shortcut_path, are not upstream)
package = com.winlator
activity = com.winlator.MainActivity
action = android.intent.action.MAIN
data = none
flags = FLAG_ACTIVITY_NEW_TASK

