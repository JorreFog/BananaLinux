[nds]
# melonDS 1.10.0 (me.magnum.melonds): EmulatorActivity is exported for the action <package>.LAUNCH_ROM and takes the
# ROM as the string extra "uri" (a content URI) or "PATH" (app/src/main/AndroidManifest.xml and
# app/src/main/java/me/magnum/melonds/ui/emulator/EmulatorActivity.kt, KEY_URI / KEY_PATH, at beta-1.10.0; ES-DE the
# same). The URI is also set as data so the read grant covers it. melonDS draws both DS screens in one window: on the
# Thor the launcher puts it on the top panel (unverified: melonDS's own dual-screen layouts on a second display)
package = me.magnum.melonds
activity = me.magnum.melonds.ui.emulator.EmulatorActivity
action = me.magnum.melonds.LAUNCH_ROM
data = content
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK FLAG_GRANT_READ_URI_PERMISSION
extra.uri = %ROMURI%

[nds.drastic]
# DraStic (com.dsemu.drastic): paid, closed source, not in the image (the owner installs it). Its activity and the
# VIEW-with-a-content-URI launch are ES-DE's (es_find_rules.xml "DRASTIC", es_systems.xml "DraStic (Standalone)");
# not checked against DraStic itself (unverified)
package = com.dsemu.drastic
activity = com.dsemu.drastic.DraSticActivity
action = android.intent.action.VIEW
data = content
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK FLAG_ACTIVITY_CLEAR_TOP FLAG_GRANT_READ_URI_PERMISSION

[3ds]
# Azahar 2126.2 (org.azahar_emu.azahar, the "vanilla" build): EmulationActivity is exported for VIEW of a content URI
# (src/android/app/src/main/AndroidManifest.xml), which EmulationFragment opens as a file descriptor
# (src/android/app/src/main/java/org/citra/citra_emu/fragments/EmulationFragment.kt, onCreate). The 3DS's bottom
# screen on the Thor's bottom panel is Azahar's own setting (unverified on a second display)
package = org.azahar_emu.azahar
activity = org.citra.citra_emu.activities.EmulationActivity
action = android.intent.action.VIEW
data = content
mime = application/octet-stream
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK FLAG_GRANT_READ_URI_PERMISSION

