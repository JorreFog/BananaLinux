# The hardware profile the menu reads under Android (BananaLauncher: <files>/root/etc/banana/hw.conf, the app's copy of
# /etc/banana/hw.conf). Only what the menu itself asks for: the rest of etc/banana/hw/thor.conf is the ROM's business
# (banana-hwd and the device tree).
HW_NAME="AYN Thor"
# the Home button under the bottom screen: its kernel key code. Under LineageOS's kernel it is a GPIO key sending
# KEY_F24 (194), which reaches the app in focus (the pad's KEY_HOME is the system's own). The launcher times its taps
# and holds (HomeButton.java, which also takes the pad's BTN_MODE, 316); the core gets the code while the quick sheet
# is up, to close it
HW_HOME=yes
HW_HOME_KEY=194
