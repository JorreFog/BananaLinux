# a launch table as android/system/launch.conf writes it (for launch-test only)
[gba]
package = com.retroarch.aarch64
activity = com.retroarch.browser.retroactivity.RetroActivityFuture
action = android.intent.action.MAIN
flags = FLAG_ACTIVITY_NEW_TASK FLAG_ACTIVITY_CLEAR_TASK
extra.ROM = %ROM%
extra.LIBRETRO = /data/data/com.retroarch.aarch64/cores/%CORE%_libretro_android.so
extra.CONFIGFILE = /storage/emulated/0/Android/data/com.retroarch.aarch64/files/retroarch.cfg

[psp]
package = org.ppsspp.ppsspp
activity = .PpssppActivity
data = file
mime = application/octet-stream

[nds]
package = me.magnum.melonds
data = content
extra.uri = %ROMURI%

[broken]
activity = no.package.Here

[pc]
package = app.gamenative
data = gamenative://run?appid=%ROMKEY:steam%&gamesource=STEAM

[scummvm]
package = com.retroarch.aarch64
core = scummvm
extra.LIBRETRO = %CORE%

[scummvm.standalone]
package = org.scummvm.scummvm
data = scummvm:%ROMTEXT%

[files]
package = banana:files

[ports]
package = none
