# ROCKNIXDS Pixel: each system's icon (rnds/icons, 32x32 pixel art) and accent colour (the top screen's sheet and the
# achievement bar).
#
#   <ES system names, comma separated>  <icon, or ->  <#accent>  [maker to show when ES has none] [[app]]
#   [app] at the end: the system is one app with a tile of its own on the shelf; A on the tile starts it
#   *<kind>   systems of that kind (ES's <hardware>: console, portable, computer, arcade, system...; "collection")
#   *         everything else
#   @<maker>  <#accent>   the accent of a system that only matched by kind
#
# The console icons nds..psx, md and arcade are BenJelter's Console Icon Pack (benjelter.itch.io/console-icon-pack);
# fav and ports are drawn for the mockup; the others (cart, disc, handheld, computer, joystick, console, gamepad,
# fantasy, phone, book, sword, music, video, picture, moon, gear, apps, collection, tools, dodakvarter, bank) are drawn
# by gen_icons.py in the same style. A name listed twice keeps its last line.

