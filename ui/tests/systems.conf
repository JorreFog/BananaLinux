# The test harness's own shelf list, not the image's. The harness checks banana-ui's screens -- the DS banner
# art, the per-game page, the settings groups in order -- and those paths live on in the UI for the RG DS, so the
# list that drives the tests keeps every shelf. The image's own list (system/rootfs/etc/banana/systems.conf) is
# trimmed per board; the Retroid Pocket Classic's has no DS or 3DS, and Settings hides those pages with it
# (Settings::setHasDs). Nothing is executed here: a 'run' line only has to name the launcher the view expects.
# Banana's systems: one [id] section each, in shelf order. The id picks the icon and colour in the theme's
# rnds/systems.cfg (nds, gba, snes...). A copy in /data/banana/systems.conf replaces this file.
#
#   name    shown on the shelf            folder  under /data/roms (default: the id)
#   maker   shown under the name          ext     file extensions that are games
#   run     the command; %ROM% is the game (quoted), %SYSTEM% the id
#   perf    the clock profile while it runs (banana-perf): powersave, balanced, performance, superdrastic
#   always  yes: on the shelf with no games, so a fresh card says where the games go
#   flat    yes: games only in the folder itself, not in its subfolders
#   folder  may also be an absolute path: an app that comes with the system (/usr/share/banana/apps/<id>)

[nds]
name = Nintendo DS
maker = Nintendo
ext = nds zip
run = /usr/libexec/banana/run-nds %ROM%
perf = superdrastic
always = yes

[gba]
name = Game Boy Advance
maker = Nintendo
ext = gba zip
run = /usr/libexec/banana/run-retroarch gpsp %ROM%
perf = balanced

[gbc]
name = Game Boy Color
maker = Nintendo
ext = gbc gb zip
run = /usr/libexec/banana/run-retroarch gambatte %ROM%
perf = powersave

[gb]
name = Game Boy
maker = Nintendo
ext = gb zip
run = /usr/libexec/banana/run-retroarch gambatte %ROM%
perf = powersave

[nes]
name = Nintendo Entertainment System
maker = Nintendo
ext = nes zip
run = /usr/libexec/banana/run-retroarch fceumm %ROM%
perf = powersave

[snes]
name = Super Nintendo
maker = Nintendo
ext = sfc smc zip
run = /usr/libexec/banana/run-retroarch snes9x %ROM%
perf = performance

[megadrive]
name = Mega Drive
maker = Sega
folder = megadrive
ext = md gen bin smd zip
run = /usr/libexec/banana/run-retroarch picodrive %ROM%
perf = powersave

[psx]
name = PlayStation
maker = Sony
ext = chd cue bin iso img mdf pbp m3u
run = /usr/libexec/banana/run-ps1 %ROM%
perf = balanced

[n64]
name = Nintendo 64
maker = Nintendo
ext = n64 z64 v64 zip
run = /usr/libexec/banana/run-retroarch mupen64plus_next %ROM%
perf = performance

[dodakvarter]
name = Döda Kvarter
maker = ROCKNIXDS
folder = /usr/share/banana/apps/dodakvarter
ext = app
run = /usr/libexec/banana/run-dodakvarter %ROM%
perf = balanced

[rocknixdsbank]
name = Bank & Trade
maker = ROCKNIXDS
folder = /usr/share/banana/apps/bank
ext = app
run = /usr/libexec/banana/run-bank %ROM%
perf = balanced

[pico-8]
name = PICO-8
maker = Lexaloffle
ext = p8 p8.png
run = /usr/libexec/banana/run-pico8 %ROM%
perf = balanced

[ports]
name = Ports
maker = PortMaster
ext = sh
run = /usr/libexec/banana/run-port %ROM%
perf = performance
flat = yes
always = yes

# BananaTube in the menu: add this to /etc/banana/systems.conf (or /data/banana/systems.conf on the card), then
# restart the menu. The package installs the app folder and the launcher; this is the only change outside it.
#
#   name    the tile's name
#   folder  the app folder the package installed
#   ext     the marker file the menu lists ("BananaTube.app")
#   run     the launcher, with the entry the menu found (%ROM%)
#   perf    the clock profile while it runs: the menu's own is not enough for a video
[bananatube]
name = YouTube
maker = Banana
folder = /usr/share/banana/apps/bananatube
ext = app
run = /usr/libexec/banana/run-bananatube %ROM%
perf = balanced

# Nintendo 3DS: each game's code is recompiled for the handheld by a PC and run
# by pocket-native, which is the parts of an emulator the game still needs
# (docs/3DS.md). The games go in roms/3ds; the library a PC built for one goes
# on the card under pocket-native/games/<title id>/.
[3ds]
name = Nintendo 3DS
maker = Nintendo
ext = zcci cci 3ds
run = /usr/libexec/banana/run-3ds %ROM%
perf = performance
always = yes
