# Samba for ui/tests/fetch-servers.sh: the image's own smb.default (its share, "Data": test / test), and a share for
# guests, "Public" (map to guest = bad user: a name Samba doesn't know logs in as its guest account)
[global]
    server string = samba
    idmap config * : range = 3000-7999
    security = user
    server min protocol = SMB2
    map to guest = bad user
    guest account = nobody

    # disable printing services
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    host msdfs = no
    wide links = yes
    follow symlinks = yes
    unix extensions = no
    acl allow execute always = yes
    ea support = yes
    mangled names = no
    dos charset = CP850
    unix charset = UTF-8

[Data]
    path = /storage
    comment = Shared
    browseable = yes
    writable = yes
    read only = no

[Public]
    path = /storage
    comment = For guests
    browseable = yes
    read only = yes
    guest ok = yes
